<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Rubalise : retour de Google</title>
<style>
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#EDF2EE;color:#10312B;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  main{max-width:420px}
  h1{font-size:26px;margin:0 0 12px}
  p{line-height:1.45;margin:0 0 10px}
  a.btn{display:inline-block;margin-top:8px;padding:12px 18px;border-radius:8px;background:#1E6F8E;color:#fff;text-decoration:none;font-weight:600}
  @media (prefers-color-scheme:dark){body{background:#0D1F1B;color:#E5F0EB}a.btn{background:#6CC0E0;color:#0D1F1B}}
</style>
</head>
<body>
<main>
  <h1>Rubalise</h1>
  <p id="msg">Retour dans l’application…</p>
  <p><a id="back" class="btn" href="#" hidden>Retourner dans Rubalise</a></p>
</main>
<script>
(function () {
  // Page de retour de la connexion Google. Elle ne contient aucun secret.
  // Applis web autorisées à recevoir le résultat (adresse du site, sans chemin) :
  var ALLOWED_WEB_ORIGINS = ['https://tom1estnza.github.io'];
  var APP_URL = 'fr.rubalise.app://auth';

  var msg = document.getElementById('msg');
  var back = document.getElementById('back');
  var p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var payload = {
    type: 'rubalise-google',
    state: p.get('state') || '',
    id_token: p.get('id_token') || '',
    error: p.get('error') || ''
  };
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  if (!payload.id_token && !payload.error) {
    msg.textContent = 'Cette page est le point de retour de la connexion Google. Rien à faire ici.';
    return;
  }

  // Application Android : le jeton ne part que vers l'appli Rubalise (adresse fr.rubalise.app://).
  if (payload.state.indexOf('a.') === 0) {
    var q = new URLSearchParams();
    q.set('state', payload.state);
    if (payload.id_token) q.set('id_token', payload.id_token);
    if (payload.error) q.set('error', payload.error);
    var url = APP_URL + '#' + q.toString();
    back.href = url;
    back.hidden = false;
    msg.textContent = 'Retour dans l’application Rubalise…';
    setTimeout(function () { location.href = url; }, 50);
    return;
  }

  // Version web : résultat transmis à la page d'origine, uniquement si elle est autorisée.
  var ok = false;
  try {
    if (window.opener) {
      ALLOWED_WEB_ORIGINS.forEach(function (o) { window.opener.postMessage(payload, o); });
      ok = true;
    }
  } catch (e) {}
  try { var bc = new BroadcastChannel('rubalise-google'); bc.postMessage(payload); bc.close(); ok = true; } catch (e) {}
  try {
    localStorage.setItem('rubalise:gresult', JSON.stringify(payload));
    setTimeout(function () { try { localStorage.removeItem('rubalise:gresult'); } catch (e) {} }, 60000);
    ok = true;
  } catch (e) {}
  msg.textContent = ok ? 'Connexion terminée : tu peux fermer cette fenêtre.' : 'Impossible de retourner dans l’application automatiquement.';
  setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
})();
</script>
</body>
</html>
