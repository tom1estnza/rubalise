name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Assembler le pont natif (localisation, connexion Google)
        continue-on-error: true
        run: npx esbuild native-src/native.js --bundle --minify --format=iife --outfile=www/native.js

      - name: Créer le projet Android
        run: npx cap add android

      - name: Autorisations et lien de retour Android
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'FOREGROUND_SERVICE',
                   'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if 'android.permission.%s"' % x not in s)
          assert '</manifest>' in s
          s = s.replace('</manifest>', add + '</manifest>')
          # Lien de retour de la connexion Google : fr.rubalise.app://
          if 'custom_url_scheme' not in s and 'android:scheme="fr.rubalise.app"' not in s:
              flt = ('            <intent-filter>\n'
                     '                <action android:name="android.intent.action.VIEW" />\n'
                     '                <category android:name="android.intent.category.DEFAULT" />\n'
                     '                <category android:name="android.intent.category.BROWSABLE" />\n'
                     '                <data android:scheme="fr.rubalise.app" />\n'
                     '            </intent-filter>\n')
              assert '</activity>' in s
              s = s.replace('</activity>', flt + '        </activity>', 1)
              print('lien fr.rubalise.app:// ajouté')
          else:
              print('lien de retour déjà présent')
          open(p, 'w', encoding='utf-8').write(s)
          print(add or 'permissions déjà présentes')
          PY

      - name: Générer les icônes
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Copier l'appli dans le projet Android
        run: npx cap sync android

      - name: Clé de signature fixe
        run: |
          # La clé est intégrée ici : plus besoin du dossier keystore sur GitHub.
          # Une même clé à chaque compilation permet d'installer les mises à jour par-dessus l'ancienne appli.
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ] && keytool -list -keystore keystore/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            cp keystore/debug.keystore ~/.android/debug.keystore
            echo "Clé fixe lue dans le dépôt (dossier keystore)."
          else
            echo "Clé fixe intégrée au fichier de compilation."
            echo "" | base64 -d > ~/.android/debug.keystore
          fi
          echo "Empreinte de la clé (SHA1 attendue : 47:FA:63:0F:B3:2D:9D:DF:11:DA:42:68:E9:CF:21:1E:96:2E:DA:C3) :"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA1" || true

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: rubalise-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
