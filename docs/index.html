<style>
:root{--bg:#EDF2EE;--ink:#10312B;--ink2:#4A625C;--line:#C7D5CE;--accent:#1E6F8E;--live:#C2125F;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0D1F1B;--ink:#E5F0EB;--ink2:#9CB5AC;--line:#294640;--accent:#6CC0E0;--live:#FF6BB0}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;width:100%;margin:0 auto;padding:48px 24px 24px}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 36px;font-weight:700;font-size:22px;letter-spacing:.01em}
.tape{display:inline-block;width:36px;height:14px;border-radius:2px;border:1px solid var(--live);background:repeating-linear-gradient(135deg,var(--live) 0 7px,var(--bg) 7px 14px)}
.pill{font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h1{margin:0 0 16px;font-size:clamp(34px,8vw,56px);line-height:1.05;letter-spacing:-.01em}
.lead{margin:0 0 12px;font-size:clamp(18px,3.4vw,21px);max-width:34em}
.mute{margin:0;color:var(--ink2)}
a{color:var(--accent)}
a:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px}
.rule{height:1px;background:var(--line);border:0;margin:32px 0 20px}
footer{max-width:640px;width:100%;margin:0 auto;padding:0 24px 28px;color:var(--ink2);font-size:14px}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
<p class="brand"><span class="tape" aria-hidden="true"></span><span>Rubalise</span><span class="pill">BÊTA</span></p>
<h1>La bêta ouvre bientôt.</h1>
<p class="lead">Rubalise t’aide à préparer ta course de trail, avec les heures de passage à chaque ravito, et à la suivre en direct.</p>
<p class="lead">Le site n’est pas encore ouvert. Reviens très bientôt.</p>
<hr class="rule">
<p class="mute">Une question ? Écris à <a href="mailto:contact@rubalise.run">contact@rubalise.run</a>.</p>
</main>
<footer><a href="/mentions-legales.html">Mentions légales</a></footer>
</body>
</html>
