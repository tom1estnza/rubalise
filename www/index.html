function act(b){
  const a=b.dataset.act,r=state.race;
  if(a==='menu'){toggleMenu();return;}
  if(a==='open-help'){closeMenu();go('help');return;}
  if(a==='tour-start'){startTour();return;}
  if(a==='skip-welcome'){state.welcomed=true;save();tab='plan';commit();window.scrollTo(0,0);if(!state.tourDone)startTour();else maybeAskPerms();return;}
  if(a==='jump'){const el=document.getElementById(b.dataset.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='save-profile'){
    if(!isRunner())return;
    flash('Enregistrement…');
    pushProfile().then(()=>{setProfStatus(profStatText());flash('Profil enregistré dans ton compte.');}).catch(e=>{setProfStatus('Enregistrement impossible : '+fbErr(e));flash(e.network?'Hors ligne : ton profil sera enregistré au retour du réseau.':fbErr(e));});
    return;
  }
  if(a==='back'){tab=prevTab||'plan';render(true);return;}
  if(a==='crew-auto'){runCrewAuto({});return;}
  if(a==='crew-auto-one'){runCrewAuto({onlyId:b.dataset.id});return;}
  if(a==='crew-cancel'){crewRun.cancel=true;return;}
  if(a==='crew-test'){crewTest();return;}
  if(a==='park-pick'){
    const r=state.race,st=r&&r.stations.find(x=>x.id===b.dataset.id),alt=st&&(st.parkAlt||[])[+b.dataset.i];
    if(!alt)return;
    const old={name:st.parking,lat:st.parkLat,lon:st.parkLon,walkMin:st.walkMin,est:!!st.walkEst};
    st.parking=alt.name;st.parkLat=alt.lat;st.parkLon=alt.lon;st.walkMin=alt.walkMin;st.walkEst=!!alt.est;st.parkAuto=true;
    st.parkAlt=(st.parkAlt||[]).filter((_,i)=>i!==+b.dataset.i);if(old.name)st.parkAlt.unshift(old);
    commit();runCrewAuto({driveOnly:true});return;
  }
  if(a==='land-open'){openLand();return;}
  if(a==='land-mode'){landMode=b.dataset.v==='3d'?'3d':'profile';renderLand();return;}
  if(a==='c3d-zoom'){v3.zoom=clampN(v3.zoom*(+b.dataset.v||1),zMin3(),4);draw3D();return;}
  if(a==='c3d-relief'){const L=[1,2,3,5];v3.relief=L[(L.indexOf(v3.relief)+1)%L.length];renderLand();return;}
  if(a==='c3d-sat'){v3.sat=!v3.sat;if(v3.sat){v3.pitch=Math.min(v3.pitch,0.62);v3.relief=Math.max(v3.relief,2);}renderLand();return;}
  if(a==='c3d-reset'){v3={yaw:-0.7,pitch:v3.sat?0.62:0.9,zoom:1,relief:3,sat:v3.sat};renderLand();return;}
  if(a==='land-close'){closeLand();return;}
  if(a==='land-edit'){openStation(b.dataset.id);return;}
  if(a==='set-theme'){state.prefs.theme=b.dataset.v;save();applyTheme();commit();return;}
  if(a==='auth-reset-self'){resetPassword(authState.email).then(()=>flash('E-mail de réinitialisation envoyé.')).catch(e=>flash(authErr(e)));return;}
  if(a==='change-pw'){changePassword((document.getElementById('newpw')||{}).value||'');return;}
  if(a==='export-data'){exportText=exportMyData();commit();return;}
  if(a==='copy-export'){const bx=document.getElementById('exportbox');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(exportText).then(()=>flash('Données copiées.'),()=>flash('Sélectionne le texte pour le copier.'));}else if(bx){bx.select();flash('Sélectionne le texte pour le copier.');}return;}
  if(a==='clear-device'){askConfirm({title:'Effacer les données de cet appareil ?',text:'La course en cours, le carnet et le profil mémorisés sur ce téléphone seront supprimés. Les données de ton compte ne sont pas touchées.',okLabel:'Effacer',danger:true,onOk:()=>{state.race=null;state.journal=[];state.profile=defaultProfile();state.profiles={};state.profileDirty=false;state.profileErr='';exportText='';commit();flash('Données de l’appareil effacées.');}});return;}
  if(a==='delete-account'){askConfirm({title:'Supprimer ton compte ?',text:'Ton compte, ton profil enregistré et la course que tu partages en direct seront supprimés définitivement.',okLabel:'Supprimer mon compte',danger:true,onOk:deleteAccountNow});return;}
  if(a==='reset-plan'&&r){askConfirm({title:'Réinitialiser le plan ?',text:'L’objectif, les ravitos, la nutrition et les pointages repartent de zéro. Le tracé GPX est conservé.'+(r.sync?' Les pointages partagés seront aussi effacés pour toute l’équipe.':''),okLabel:'Réinitialiser',danger:true,onOk:resetPlanNow});return;}
  if(a==='delete-race'&&r){askConfirm({title:'Supprimer la course ?',text:'Le tracé GPX et tout le plan seront supprimés.'+(r.sync&&r.sync.role==='owner'?' Le suivi en direct sera arrêté et la course supprimée du serveur.':''),okLabel:'Supprimer',danger:true,onOk:deleteRaceNow});return;}
  if(a==='show-gpx-paste'){gpxPasteOpen=!gpxPasteOpen;commit();return;}
  if(a==='do-gpx-paste'){const bx=document.getElementById('gpxbox');if(!bx||!bx.value.trim()){flash('Colle d’abord le contenu du GPX.');return;}loadGPXText(bx.value,'Ma course');return;}
  if(a==='demo'){state.race=demoRace();animateNext=true;tab='plan';commit();window.scrollTo(0,0);return;}
  if(a==='show-import'){importOpen=!importOpen;shareCode='';commit();return;}
  if(a==='do-import'){
    const box=document.getElementById('importbox');
    try{state.race=importCode(box?box.value:'');importOpen=false;animateNext=true;tab='plan';commit();window.scrollTo(0,0);flash('Plan importé.');}
    catch(err){flash(err.message);}
    return;
  }
  if(a==='join'){
    const bx=document.getElementById('joincode');
    flash('Connexion au suivi…');
    joinCourse(bx?bx.value:'').then(race=>{state.welcomed=true;state.race=race;animateNext=true;tab='live';commit();window.scrollTo(0,0);flash('Course rejointe : '+race.name+'.');}).catch(e=>flash(fbErr(e)));
    return;
  }
  if(a==='google-login'){googleLogin('signin');return;}
  if(a==='google-link'){googleLogin('link');return;}
  if(a==='auth-mode'){loginMode=loginMode==='in'?'up':'in';commit();return;}
  if(a==='auth-submit'){doAuth();return;}
  if(a==='auth-reset'){
    const em=((document.getElementById('authmail')||{}).value||'').trim();
    if(!em){flash('Saisis d’abord ton e-mail ci-dessus.');return;}
    resetPassword(em).then(()=>flash('Si un compte existe, un e-mail de réinitialisation vient d’être envoyé.')).catch(e=>flash(authErr(e)));return;
  }
  if(a==='sign-out'){signOutRunner();return;}
  if(a==='apply-zone'){
    const rr=state.race,est=zoneEstimate(state.profile,rr);
    if(!rr||!est){flash('Renseigne ta performance de référence.');return;}
    rr.target=fmtHM(est.total);commit();flash('Temps visé mis à jour : '+rr.target+'.');return;
  }
  if(a==='sync-test'){flash('Test de connexion…');getToken().then(()=>flash('Connexion Firebase OK.')).catch(e=>flash(fbErr(e)));return;}
  if(a==='del-journal'){state.journal=(state.journal||[]).filter(x=>x.id!==b.dataset.id);commit();return;}
  if(!r)return;
  if(a==='share-live'){
    if(!isRunner()){loginMode='up';tab='login';commit();window.scrollTo(0,0);flash('Crée un compte coureur pour partager une course.');return;}
    flash('Création du suivi en direct…');
    startShare(r).then(code=>{commit();flash('Suivi créé. Code : '+code);}).catch(e=>flash(fbErr(e)));
    return;
  }
  if(a==='sync-now'){flash('Synchronisation…');syncNow();return;}
  if(a==='gps-start'){askConfirm({title:'Partager ma position ?',text:'Rubalise utilisera la localisation de ton téléphone et enverra ton kilomètre sur le parcours à ton assistance (jamais tes coordonnées). Cela consomme de la batterie.',okLabel:'Démarrer',onOk:gpsStart});return;}
  if(a==='gps-stop'){if(r)r.gpsArmed=false;gpsStop();commit();flash('Suivi GPS arrêté.');return;}
  if(a==='perm-request'){ensurePermissions().then(ps=>flash(ps.loc==='granted'?'Localisation autorisée.':'Localisation non autorisée : ouvre les réglages du téléphone pour l’activer.'));return;}
  if(a==='perm-settings'){const N=nativeGeo();try{if(N&&N.BackgroundGeolocation.openSettings)N.BackgroundGeolocation.openSettings();}catch(e){}return;}
  if(a==='stop-sync'){
    if(r.sync&&r.sync.role==='member'){
      const n=Object.keys(r.pending||{}).length;
      askConfirm({title:'Quitter ce suivi ?',text:'Le plan, les pointages et la position enregistrés sur cet appareil seront supprimés.'+(n?' '+n+' pointage'+(n>1?'s':'')+' pas encore envoyé'+(n>1?'s':'')+' sera perdu'+(n>1?'s':'')+'.':''),okLabel:'Quitter et tout supprimer',danger:true,onOk:leaveFollowNow});
    }else{
      askConfirm({title:'Arrêter le partage ?',text:'Le code ne fonctionnera plus pour ton équipe. Ton plan reste sur ton téléphone.',okLabel:'Arrêter le partage',danger:true,onOk:stopShareNow});
    }
    return;
  }
  if(a==='copy-live-code'){
    const c=r.sync&&r.sync.code;if(!c)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(()=>flash('Code copié : '+c),()=>flash('Code : '+c));}else flash('Code : '+c);
    return;
  }
  if(a==='add-station'){
    const m=model(r),last=r.stations.length?r.stations[r.stations.length-1].km:0;
    const km=Math.round(((last+m.tot)/2)*10)/10;
    r.stations.push({id:uid(),name:'Ravito '+(r.stations.length+1),km,access:true,barrier:'',barrierAuto:true,items:[]});
    applyAutoBarriers(r);r.stations.sort((x,y)=>x.km-y.km);commit();return;
  }
  if(a==='del-station'){r.stations=r.stations.filter(s=>s.id!==b.dataset.id);delete r.points[b.dataset.id];commit();return;}
  if(a==='item-cat'){
    const id=b.dataset.id,ab=document.getElementById('ab-'+id),inp=document.getElementById('it-'+id),mode=b.dataset.mode||'count';
    if(ab)ab.dataset.mode=mode;
    if(inp){
      inp.value=(mode==='count')?(b.dataset.fill||''):'';inp.dataset.cat=b.dataset.cat;
      inp.placeholder=mode==='clothes'?'Autre vêtement (facultatif)':(mode==='free'?'Écris ce qu’il faut préparer':'Ex. gels, compotes');
      if(mode!=='clothes')inp.focus();
    }
    document.querySelectorAll('.chip[data-act="item-cat"][data-id="'+id+'"]').forEach(c=>c.classList.toggle('on',c===b));
    return;
  }
  if(a==='cloth-toggle'){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));return;}
  if(a==='qty-step'){const inp=document.getElementById('iq-'+b.dataset.id);if(inp)inp.value=clampN((parseInt(inp.value,10)||1)+(+b.dataset.d||0),1,99);return;}
  if(a==='item-qty'){
    const d=+b.dataset.d||0,iid=b.dataset.iid;
    if(b.dataset.list==='extra'&&isMember(r)&&r.extras&&r.extras[iid]){r.extras[iid].q=clampN((r.extras[iid].q||1)+d,1,99);queuePoint(r,'x:'+iid,JSON.stringify(r.extras[iid]));commit();syncSoon();}
    else if(b.dataset.list==='runner'&&!isMember(r)){const sx=r.stations.find(x=>x.id===b.dataset.id),it=sx&&(sx.items||[]).find(x=>x.id===iid);if(it){it.q=clampN((it.q||1)+d,1,99);commit();}}
    return;
  }
  if(a==='item-add'){
    const id=b.dataset.id,ab=document.getElementById('ab-'+id),mode=(ab&&ab.dataset.mode)||'count',inp=document.getElementById('it-'+id),q=document.getElementById('iq-'+id),now=Date.now();
    if(now-itemAddAt<500)return;
    let ok=false;
    if(mode==='clothes'){
      const sel=Array.prototype.slice.call(document.querySelectorAll('#ab-'+id+' .clothes .chip[aria-pressed="true"]')).map(c=>c.dataset.v),other=inp&&inp.value.trim();
      if(!sel.length&&!other){flash('Choisis au moins un vêtement dans la liste, ou écris-le dans « Autre vêtement ».');return;}
      sel.forEach(v=>{ok=addItem(r,id,v,1,'vetement')||ok;});
      if(other)ok=addItem(r,id,other,1,'vetement')||ok;
    }else{
      if(!inp||!inp.value.trim()){flash('Écris ce qu’il faut préparer, par exemple « gels ».');if(inp)inp.focus();return;}
      ok=addItem(r,id,inp.value,mode==='free'?1:(q&&q.value),inp.dataset.cat);
    }
    if(ok){itemAddAt=now;commit();syncSoon();}
    return;
  }
  if(a==='item-del'){
    const id=b.dataset.id,iid=b.dataset.iid;
    if(b.dataset.list==='extra'&&isMember(r)){delete r.extras[iid];queuePoint(r,'x:'+iid,null);commit();syncSoon();}
    else if(b.dataset.list==='runner'&&!isMember(r)){const s=r.stations.find(x=>x.id===id);if(s){s.items=(s.items||[]).filter(x=>x.id!==iid);delete r.done[iid];commit();}}
    return;
  }
  if(a==='copy-code'){
    shareCode=exportCode(r);importOpen=false;commit();
    copyText(shareCode,ok=>flash(ok?'Code copié. Envoie-le à ton équipe.':'Copie automatique impossible : le code est affiché ci-dessous, sélectionne-le.'));
    return;
  }
  if(a==='point'){
    const m=model(r),tl=timeline(r,m,{}),idx=tl.rows.findIndex(x=>x.actual==null&&!x.passedEst);if(idx<0)return;
    const inp=document.getElementById('pt-time');let min=parseClock(inp&&inp.value);
    if(min==null){flash('Saisis une heure de passage.');return;}
    const lastDone=tl.rows.filter(x=>x.actual!=null).map(x=>x.actual).pop();
    const floor=lastDone!=null?lastDone:m.start0;
    while(min<floor-5)min+=1440;
    const prow=tl.rows[idx];
    r.points[prow.id]=min;queuePoint(r,prow.id,min);
    if(!r.fix||min>=r.fix.t-1)setFix(r,Math.round(prow.km*100)/100,min,0);
    commit();syncSoon();flash('Passage pointé : '+prow.name+'.');return;
  }
  if(a==='undo'){
    const m=model(r),tl=timeline(r,m,{});let k=-1;tl.rows.forEach((x,i)=>{if(x.actual!=null)k=i;});
    if(k>=0){
      const urow=tl.rows[k],was=urow.actual;
      delete r.points[urow.id];queuePoint(r,urow.id,null);
      if(r.fix&&!r.fix.src&&Math.abs(r.fix.km-urow.km)<0.011&&Math.round(r.fix.t)===Math.round(was)){
        clearFix(r);
        const prev=tl.rows.slice(0,k).filter(x=>x.actual!=null).pop();
        if(prev)setFix(r,Math.round(prev.km*100)/100,prev.actual,0);
      }
      commit();syncSoon();
    }
    return;
  }
  if(a==='clear-points'){Object.keys(r.points).forEach(id=>queuePoint(r,id,null));r.points={};clearFix(r);if(r.startAt!=null){r.startAt=null;queuePoint(r,'startat',null);}commit();syncSoon();return;}
  if(a==='set-fix'){
    const m=model(r),kmv=parseFloat(String((document.getElementById('fix-km')||{}).value||'').replace(',','.')),tv=parseClock((document.getElementById('fix-t')||{}).value);
    if(!isFinite(kmv)||kmv<=0||kmv>m.tot){flash('Indique un kilomètre entre 0 et '+km1(m.tot)+'.');return;}
    if(tv==null){flash('Indique l’heure de cette position.');return;}
    const lastDone=Object.keys(r.points||{}).map(k=>r.points[k]).sort((x,y)=>x-y).pop();
    const floor=lastDone!=null?lastDone:m.start0;let min=tv;while(min<floor-5)min+=1440;
    setFix(r,Math.round(kmv*10)/10,min);commit();syncSoon();flash('Position enregistrée : km '+km1(kmv)+'.');return;
  }
  if(a==='start-race'){
    const m=model(r),tv=(b.dataset.at==='plan')?m.startMin:parseClock((document.getElementById('start-time')||{}).value);
    if(tv==null){flash('Indique l’heure du départ.');return;}
    let min=tv;const floor=m.startMin-360;while(min<floor)min+=1440;
    r.startAt=min;queuePoint(r,'startat',min);commit();syncSoon();maybeAutoGps();flash('Départ enregistré à '+fmtClock(min).s+'.');return;
  }
  if(a==='clear-start'){r.startAt=null;queuePoint(r,'startat',null);if(r.gpsAutoStarted&&gpsOn)gpsStop();commit();syncSoon();flash('Départ annulé.');return;}
  if(a==='set-plan-start'){
    if(isMember(r))return;
    const v=(document.getElementById('plan-start')||{}).value;
    if(parseClock(v)==null){flash('Indique une heure.');return;}
    r.start=v;applyAutoBarriers(r);commit();syncSoon();flash('Heure de départ prévue : '+v+'.');return;
  }
  if(a==='gps-arm'){r.gpsArmed=true;r.gpsAutoStarted=false;save();maybeAutoGps();commit();flash(r.startAt!=null?'GPS activé.':'GPS armé : il démarrera quand le départ sera donné.');return;}
  if(a==='gps-disarm'){r.gpsArmed=false;commit();flash('GPS désarmé.');return;}
  if(a==='clear-fix'){clearFix(r);commit();syncSoon();flash('Position annulée.');return;}
  if(a==='simulate'){
    const m=model(r),tl=timeline(r,m,{plan:true}),stop=+r.stopMin||0;
    r.points={};
    tl.rows.slice(0,Math.min(3,tl.rows.length-1)).forEach((x,i)=>{r.points[x.id]=Math.round(m.startMin+m.M(x.km)*1.10+i*stop);});
    commit();flash('Pointages simulés pour les 3 premiers points.');return;
  }
  if(a==='rating'){r.diary=r.diary||{};r.diary.rating=(r.diary.rating===+b.dataset.v)?0:+b.dataset.v;commit();return;}
  if(a==='archive'){
    const m=model(r),tl=timeline(r,m,{}),st=profileStats(m.p),fin=tl.rows[tl.rows.length-1],d=r.diary||{};
    state.journal=state.journal||[];
    state.journal.unshift({id:uid(),name:r.name,date:r.date,km:st.km,up:st.up,planned:m.target,actual:fin.actual!=null?fin.actual-m.startMin:null,rating:d.rating||0,learn:(d.learn||'').slice(0,160)});
    gpsStop();
    if(r.sync){delete r.sync;r.pending={};}
    r.fix=null;r.startAt=null;r.points={};r.diary={rating:0,nutrition:'',learn:'',gear:''};commit();flash('Course archivée dans le carnet.');return;
  }
}
document.addEventListener('click',e=>{
  const tr=e.target.closest('[data-tour]');
  if(tr){tourAct(tr.dataset.tour);return;}
  const ma=e.target.closest('[data-mact]');
  if(ma){const f=(ma.dataset.mact==='ok')?modalOk:null;closeModal();if(f)f();return;}
  if(!document.getElementById('modal').hidden&&e.target.id==='modal'){closeModal();return;}
  const fc=e.target.closest('[data-fixchart]');
  if(fc&&!e.target.closest('[data-hit]')){
    const svg=fc.querySelector('svg');
    if(svg){
      const rc=svg.getBoundingClientRect(),W=+fc.dataset.w,L=+fc.dataset.l,R=+fc.dataset.r,tot=+fc.dataset.tot;
      const x=(e.clientX-rc.left)*(W/rc.width),km=Math.max(0,Math.min(tot,(x-L)/(W-L-R)*tot)),inp=document.getElementById('fix-km');
      if(inp&&rc.width>0){inp.value=(Math.round(km*10)/10).toFixed(1);flash('Km '+km1(km)+' choisi. Vérifie l’heure puis enregistre la position.');}
    }
    return;
  }
  const hit=e.target.closest('[data-hit]');
  if(hit&&landOpen){landSel=(landSel===hit.dataset.hit)?null:hit.dataset.hit;renderLand();return;}
  const mi=e.target.closest('[data-menu]');
  if(mi){
    const k=mi.dataset.menu;closeMenu();
    if(k==='signout')signOutRunner();else go(k);
    return;
  }
  if(menuOpen&&!e.target.closest('#menu')&&!e.target.closest('#acct'))closeMenu();
  const tb=e.target.closest('[data-tab]');
  if(tb){if(MAIN_TABS.indexOf(tab)>=0&&tb.dataset.tab!==tab)prevTab=tab;tab=tb.dataset.tab;shareCode='';importOpen=false;gpxPasteOpen=false;clearTimeout(renderTimer);render(true);return;}
  const b=e.target.closest('button[data-act]');
  if(b)act(b);
});
document.addEventListener('change',e=>{
  const t=e.target,r=state.race;
  if(t.dataset&&t.dataset.gpx!==undefined){const f=t.files&&t.files[0];if(f)importGPX(f);return;}
  if(t.dataset&&t.dataset.gpsevery!==undefined){state.prefs.gpsEvery=(t.value==='auto')?'auto':(+t.value||120);save();return;}
  if(t.dataset&&t.dataset.pref){
    const k=t.dataset.pref;let v=parseFloat(String(t.value).replace(',','.'));if(!isFinite(v)||v<0)v=defaultPrefs()[k];
    state.prefs[k]=v;t.value=v;save();return;
  }
  if(t.dataset&&t.dataset.p){
    const k=t.dataset.p;let v=t.value;
    if(k==='refTime'){v=fmtTypedTime(v,true);t.value=v;}
    state.profile=state.profile||defaultProfile();state.profile[k]=v;save();pushProfileSoon();
    if(k!=='first')schedule();
    return;
  }
  if(!r)return;
  if(t.dataset.act==='item-done'){
    r.done=r.done||{};const iid=t.dataset.iid;
    if(t.checked){r.done[iid]=1;queuePoint(r,'d:'+iid,1);}else{delete r.done[iid];queuePoint(r,'d:'+iid,null);}
    save();syncSoon();return;
  }
  if(t.dataset.diary){r.diary=r.diary||{};r.diary[t.dataset.diary]=t.value;save();return;}
  const sid=t.dataset.s;
  if(sid){
    const s=r.stations.find(x=>x.id===sid);if(!s)return;const f=t.dataset.f;
    if(f==='access')s.access=t.checked;
    else if(f==='km'){let v=parseFloat(String(t.value).replace(',','.'));if(isNaN(v))v=s.km;s.km=Math.max(0,Math.round(v*10)/10);}
    else if(f==='barrier'){s.barrier=t.value;s.barrierAuto=!t.value;}
    else if(f==='walkMin'||f==='driveMin'){
      const raw=String(t.value).trim().replace(',','.');
      s[f]=raw===''?null:okMin(parseFloat(raw),f==='walkMin'?180:600);s.parkAuto=false;if(f==='walkMin')s.walkEst=false;
      if(raw!==''&&s[f]===null)flash('Valeur invalide : saisis un nombre de minutes.');
    }
    else if(f==='parking'){
      const v=String(t.value).trim().slice(0,80),c=parseLatLon(v);
      s.parking=v;s.parkLat=c?c.lat:null;s.parkLon=c?c.lon:null;s.parkAuto=false;s.parkAlt=[];
    }
    else s[f]=t.value;
    if(f==='km'||f==='barrier')applyAutoBarriers(r);
    r.stations.sort((x,y)=>x.km-y.km);schedule();return;
  }
  const rf=t.dataset.r;
  if(rf){
    let v=t.value;
    if(rf==='target'){v=fmtTyped(v,true);t.value=v;}
    if(rf==='trackUrl'){const u=cleanUrl(v);if(u===null){flash('Lien invalide : il doit commencer par https://');t.value=r.trackUrl||'';return;}v=u;t.value=u;}
    if(t.dataset.num!==undefined){v=parseFloat(v);if(isNaN(v)||v<0)v=0;}
    if(rf==='crewMargin'){v=Math.max(0,Math.min(60,Math.round(v)));t.value=v;}
    r[rf]=v;
    if(rf==='finishBarrier')r.finishBarrierAuto=!v;
    if(rf==='start'||rf==='minSpeed'||rf==='finishBarrier')applyAutoBarriers(r);
    schedule();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.r==='target'){t.value=fmtTyped(t.value,false);return;}
  if(t.dataset&&t.dataset.p==='refTime'){t.value=fmtTypedTime(t.value,false);return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.itadd){e.preventDefault();const bt=document.querySelector('[data-act="item-add"][data-id="'+e.target.dataset.itadd+'"]');if(bt)bt.click();}
  if(e.key==='Enter'&&e.target.id==='authpass'){doAuth();}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.hit&&landOpen){e.preventDefault();landSel=(landSel===e.target.dataset.hit)?null:e.target.dataset.hit;renderLand();}
  if(e.key==='Escape'){
    if(tourOn)endTour();
    else if(!document.getElementById('modal').hidden)closeModal();
    else if(landOpen)closeLand();
    else if(menuOpen){closeMenu();const ab=document.getElementById('acct');if(ab)ab.focus();}
  }
});
document.addEventListener('fullscreenchange',()=>{if(landOpen&&landFs&&!document.fullscreenElement)closeLand();else renderLand();});
window.addEventListener('orientationchange',()=>setTimeout(renderLand,250));
window.addEventListener('resize',()=>{if(landOpen)renderLand();if(menuOpen)closeMenu();if(tourOn)positionTour();});
let rz=null,lastW=0;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const w=root.clientWidth;if(w!==lastW&&(tab==='plan'||tab==='live')){lastW=w;render();}},180);});
setInterval(()=>{
  if(tab!=='live'||!state.race)return;
  const ae=document.activeElement;
  if(ae&&root.contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName))return;
  render();
},30000);

setInterval(()=>{
  const r=state.race;if(!r||!r.sync||document.hidden)return;
  const age=Date.now()-(r.sync.lastSync||0),every=(tab==='live')?10000:30000;
  if(age>=every||Object.keys(r.pending||{}).length)syncNow();
},5000);
document.addEventListener('click',e=>{
  const l=e.target.closest&&e.target.closest('.maplinks a'),N=window.RubaliseNative;
  if(l&&N&&N.Browser){e.preventDefault();N.Browser.open({url:l.href}).catch(()=>flash('Impossible d’ouvrir le navigateur.'));}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNow();maybeAutoGps();}});
setInterval(maybeAutoGps,5000);
window.addEventListener('online',()=>syncNow());

if(state.tmpRace){state.race=null;state.tmpRace=false;save();}
if(state.race){try{migrateRace(state.race);ensureItems(state.race);save();}catch(e){}}
if(!state.welcomed&&(state.race||(state.journal&&state.journal.length)||isRunner())){state.welcomed=true;state.tourDone=true;save();}
if(!state.welcomed&&!isRunner())tab='welcome';
lastW=root.clientWidth;
render(true);
maybeAskPerms();
if(state.race&&state.race.sync)syncSoon();
if(isRunner()&&state.profileDirty)pushProfile().catch(()=>{});
setInterval(()=>{if(isRunner()&&state.profileDirty&&!document.hidden)pushProfile().catch(()=>{});},30000);
})();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
