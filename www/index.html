<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10312B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rubalise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rubalise, plan de course trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2EE; --surface:#F8FBF9; --ink:#10312B; --ink2:#4A625C; --line:#C7D5CE;
  --accent:#1E6F8E; --accent-ink:#FFFFFF; --live:#C2125F; --z1:#7DB3A0; --z2:#3E8E69; --z3:#1E6F8E; --z4:#B26A00; --z5:#C2125F; --ok:#2B7A4B; --warn:#9A5B00; --fill:#D3E3DB;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Barlow Semi Condensed','Barlow',system-ui,'Arial Narrow',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1F1B; --surface:#132B25; --ink:#E5F0EB; --ink2:#9CB5AC; --line:#294640;
    --accent:#6CC0E0; --accent-ink:#0D1F1B; --live:#FF6BB0; --z1:#6FB09B; --z2:#6FD398; --z3:#6CC0E0; --z4:#F0B050; --z5:#FF6BB0; --ok:#6FD398; --warn:#F0B050; --fill:#1B3B34;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1F1B; --surface:#132B25; --ink:#E5F0EB; --ink2:#9CB5AC; --line:#294640;
  --accent:#6CC0E0; --accent-ink:#0D1F1B; --live:#FF6BB0; --z1:#6FB09B; --z2:#6FD398; --z3:#6CC0E0; --z4:#F0B050; --z5:#FF6BB0; --ok:#6FD398; --warn:#F0B050; --fill:#1B3B34;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.app{max-width:680px;margin:0 auto;padding:12px 16px 112px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--f-num);letter-spacing:.01em}
.tape{display:inline-block;width:30px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--live) 0 6px,var(--bg) 6px 12px);border:1px solid var(--live)}
.proto{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

h1{font:700 34px/1.05 var(--f-num);margin:24px 0 12px}
h2{font:600 21px/1.2 var(--f-num);margin:0 0 10px}
h3{font:600 19px/1.2 var(--f-num);margin:0 0 6px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
p{margin:0 0 10px}
small{font-size:13px;color:var(--ink2)}
.sec{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}
.lead{color:var(--ink2);max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:12px 0}
.km{font:500 15px var(--f-num);color:var(--ink2)}
.t{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.08em}
.jd{font-size:11px;color:var(--ink2);margin-left:2px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--live)}
.note{font-size:14px;color:var(--ink2);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:600;cursor:pointer;touch-action:manipulation;text-align:center}
.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
button{touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.icon{min-width:44px;min-height:44px;border:0;background:transparent;font-size:24px;color:var(--ink2);cursor:pointer}

.fld{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.fld input,.fld textarea,.in{min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink);width:100%}
textarea.in{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.chk{flex-direction:row;align-items:center;gap:8px;min-height:44px;color:var(--ink)}

.race-name{font:700 clamp(22px,6.2vw,30px)/1.15 var(--f-num);text-overflow:ellipsis;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0;color:var(--ink);border-radius:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0}
.stats div{display:flex;flex-direction:column-reverse}
.stats dt{font-size:13px;color:var(--ink2)}
.stats dd{margin:0;font:700 24px/1.1 var(--f-num)}
.chart{margin:14px -4px 0}
.chart svg{display:block;width:100%;height:auto}
.pf-area{fill:var(--fill)}
.pf-line{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.pf-grid{stroke:var(--line);stroke-width:1}
.pf-dash{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.pf-txt{fill:var(--ink2);font:500 11px var(--f-num)}
.pf-num{fill:var(--ink);font:600 12px var(--f-num)}
.pf-stn{stroke:var(--accent);stroke-width:2}
.pf-live{stroke:var(--live);stroke-width:2}
@media (prefers-reduced-motion: no-preference){
  .pf-line.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
.legend{font-size:13px;color:var(--ink2);display:flex;gap:2px 16px;flex-wrap:wrap;margin-top:4px}

.stn{list-style:none;padding:14px 0;border-bottom:1px solid var(--line)}
.stn:last-child{border-bottom:0}
.stn-head{display:flex;align-items:center;gap:8px}
.stn-n{font:700 18px var(--f-num);min-width:22px;color:var(--accent)}
.stn-name{flex:1;min-width:0;font:600 19px var(--f-num);border:0;border-bottom:1.5px solid var(--line);background:transparent;min-height:44px;padding:4px 0;border-radius:0;color:var(--ink)}
.stn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;margin-top:8px}
.stn-grid .chk{grid-column:1 / -1}
.crewauto{margin:12px 0}
#crewauto .note{margin:3px 0}
.stn-crew{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.stn-times{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:15px}
ul.plain{list-style:none;padding:0;margin:0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:500;color:var(--ink2);text-align:left;font-size:13px;padding:6px 8px 6px 0;border-bottom:1.5px solid var(--line)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
td small{display:block}

.crew{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin:0 0 26px}
.crew.passed{border-left-color:var(--line);opacity:.75}
.win{font-size:16px}
.items{list-style:none;padding:0;margin:8px 0}
.items li{display:flex;align-items:center;gap:6px;min-height:40px}
.items label{flex:1;display:flex;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:6px}
.igroup{margin:10px 0 4px}
.igroup h4{font:600 15px var(--f-num);margin:0 0 2px;color:var(--ink2)}
.igroup .note{margin:2px 0 4px}
.lockic{display:inline-flex;align-items:center;color:var(--ink2);padding:0 8px}
.lockic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addrow .in{flex:1}

.clock{font:700 60px/1 var(--f-num);font-variant-numeric:tabular-nums}
.status{font-size:16px;color:var(--ink2);margin:4px 0 0}
.sum{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px}
.sum div{display:flex;flex-direction:column-reverse}
.sum dt{font-size:13px;color:var(--ink2)}
.sum dd{margin:0;font:700 26px/1.1 var(--f-num)}
.pts{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.pts::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.pt{position:relative;padding:10px 0 14px}
.pt::before{content:"";position:absolute;left:-22px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--ink2)}
.pt.done::before{background:var(--ink);border-color:var(--ink)}
.pt.next::before{background:var(--live);border-color:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 25%,transparent)}
.pt-main{font:600 18px var(--f-num)}
.pt-times{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:15px;margin-top:2px}
.pt-times span small{margin-right:4px}

.rating{display:flex;gap:8px;margin:6px 0 14px}
.rating button{flex:1;min-height:48px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font:600 18px var(--f-num);cursor:pointer}
.rating button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.journal{list-style:none;padding:0;margin:0}
.journal li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:96px}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbtn{min-height:64px;border:0;background:transparent;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px}
.tabbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbtn span{font-size:12px;font-weight:600;line-height:1}
.tabbtn[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--live)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.empty{padding-top:8px}
body input[type=checkbox]{-webkit-appearance:none;appearance:none;width:26px;height:26px;min-height:0;flex:none;margin:0;padding:0;border-radius:50%;border:2px solid var(--ink2);background:color-mix(in srgb,var(--ink) 7%,transparent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;transition:background .15s,border-color .15s}
body input[type=checkbox]::after{content:"";width:11px;height:6px;border-left:3px solid var(--accent-ink);border-bottom:3px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg);opacity:0;transition:opacity .12s}
body input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
body input[type=checkbox]:checked::after{opacity:1}
body input[type=checkbox]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper .step{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:20px;line-height:1;color:var(--ink);cursor:pointer;touch-action:manipulation;padding:0}
.stepper .qty{flex:none;width:46px;min-height:34px;height:34px;padding:0 2px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.mini .step{width:30px;height:30px;font-size:18px}
.stepper.mini .qv{min-width:24px;text-align:center;font:600 16px var(--f-num)}
.addbox .clothes{display:none}
.addbox[data-mode="clothes"] .clothes{display:block}
.addbox[data-mode="clothes"] .stepper,.addbox[data-mode="free"] .stepper{display:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crew.hl{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px}
.maplinks{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.maplinks a.btn{text-decoration:none}
.c3d-credit{position:absolute;right:4px;top:4px;font-size:11px;color:var(--ink);max-width:60%;text-align:right;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:2px 8px;border-radius:999px}
.c3d-credit:empty{display:none}
.in:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible,.fld input:not([type=checkbox]):not([type=range]):focus-visible,.in:focus,.fld input:not([type=checkbox]):not([type=range]):focus{outline:none;border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.stn-name:focus-visible,.race-name:focus-visible{outline:none;border-bottom-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.grid2,.grid3{align-items:end}
.fld input:not([type=checkbox]):not([type=range]),.fld select,select.in,input.in{height:46px}
.fld input,.fld textarea,.fld select,.in{box-sizing:border-box;min-width:0;max-width:100%}
.topbtns{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font:700 18px var(--f-num);color:var(--ink2);cursor:pointer;touch-action:manipulation}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;margin:0 0 14px}
.card h2{margin:0 0 4px}
.hint{font-size:14px;color:var(--ink2);margin:0 0 10px;max-width:60ch}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:16px;min-height:44px;cursor:pointer;text-decoration:underline;padding:0 4px;touch-action:manipulation}
.chips-nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chk-list{list-style:none;margin:8px 0 0;padding:0}
.chk-list li{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.chk-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.chk-list li.ok .chk-dot{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.welcome .top,.welcome .tabs{display:none}
.welcome .app{padding-bottom:36px}
.brand-big{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px 0 2px}
.logo-lg{display:inline-flex;flex-direction:column;align-items:stretch;gap:9px;font:700 52px/1 var(--f-num);letter-spacing:.01em}
.tape-lg{display:block;width:100%;height:14px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--live) 0 12px,var(--bg) 12px 24px);border:2px solid var(--live)}
.tagline{font:500 20px/1.25 var(--f-body);color:var(--ink2);text-align:center;max-width:24ch;margin:0 auto}
.hero-art{width:100%;max-width:380px;height:auto;margin:10px auto 6px;display:block}
.hero-art .pf-line{stroke-width:2.4}
#tour{position:fixed;inset:0;z-index:50}
#tourblock{position:absolute;inset:0}
#tourhl{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,18,15,.64);border:3px solid var(--live);pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
#tourhl.none{border-color:transparent}
#tourcard{position:absolute;left:12px;right:12px;max-width:440px;margin:0 auto;background:var(--surface);border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.4);max-height:calc(100vh - 24px);overflow:auto}
#tourcard:focus{outline:none}
#tourcard h2{margin:2px 0 6px}
#tourcard p{margin:0 0 6px}
.touring #view{filter:blur(2px)}
#tourhl{border-radius:12px}
.tour-step{font-size:13px;color:var(--ink2);font-weight:600}
.tour-dots{display:flex;gap:6px;margin:12px 0 4px}
.tour-dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.tour-dots i.on{background:var(--live);width:22px}
@media (prefers-reduced-motion: reduce){#tourhl{transition:none}}
[hidden]{display:none!important}
body.noscroll{overflow:hidden}
.btn.danger{border-color:var(--live);color:var(--live)}
.btn.danger.fill{background:var(--live);border-color:var(--live);color:var(--accent-ink)}
.menu{position:fixed;z-index:15;min-width:250px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px}
.menu-head{padding:10px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:2px}
.menu-head b{font:600 18px var(--f-num)}
.menu button{display:flex;width:100%;min-height:48px;align-items:center;padding:0 12px;border:0;background:transparent;border-radius:8px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--fill)}
.menu .dng{color:var(--live)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,18,15,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal-card h2{margin-bottom:8px}
.back{margin:4px 0 0;min-height:40px;padding:0;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:16px;cursor:pointer}
details{border-top:1px solid var(--line);padding:6px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font:600 18px var(--f-num);cursor:pointer;min-height:44px;display:flex;align-items:center}
details p,details ol{margin:4px 0 10px;color:var(--ink);max-width:62ch}
.stn.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:8px}
.pf-hit{cursor:pointer;outline:none}
.pf-hit:focus-visible .pf-stn{stroke:var(--live);stroke-width:3}
.land{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:hidden}
.land-inner{position:absolute;display:flex;flex-direction:column;padding:8px 14px;box-sizing:border-box}
.land:not(.rotated) .land-inner{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.land-top{display:flex;align-items:center;gap:12px;flex:none}
.land-top b{font:700 18px var(--f-num)}
.land-mode{display:flex;gap:4px}
.land-mode button{min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);touch-action:manipulation}
.land-mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#c3d{position:absolute;left:0;top:0;touch-action:none;cursor:grab}
#c3dgl{position:absolute;left:0;top:0;pointer-events:none}
.c3d-tools{position:absolute;left:0;bottom:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.c3d-tools .btn{min-height:34px;padding:0 10px;font-size:14px;background:var(--bg)}

#acct.run{min-width:38px;width:38px;padding:0;border-radius:50%;font-weight:700;font-size:16px}

<script>
(function(){
'use strict';

// <core>
const RT=6371;
function hav(a,b){const r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;const s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*RT*Math.asin(Math.sqrt(s));}
function cumDist(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+hav(pts[i-1],pts[i]));return c;}
function interp(xs,ys,x){const n=xs.length;if(x<=xs[0])return ys[0];if(x>=xs[n-1])return ys[n-1];let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(xs[m]<=x)lo=m;else hi=m;}const t=(x-xs[lo])/((xs[hi]-xs[lo])||1);return ys[lo]+(ys[hi]-ys[lo])*t;}
// Dénivelé cumulé sur la trace complète (et non sur le profil réduit à 220 points, qui aplatit les petites bosses).
// Seuil de 1 m si les altitudes sont des mètres entiers (déjà arrondies), 2 m sinon (bruit des altitudes décimales).
function elevCum(pts){
  let ints=0;pts.forEach(q=>{if(Math.abs(q.ele-Math.round(q.ele))<1e-6)ints++;});
  const thr=ints>=pts.length*0.9?1:2,cu=[0],cd=[0];
  let up=0,dn=0,ref=pts[0].ele;
  for(let i=1;i<pts.length;i++){
    const v=pts[i].ele;
    if(v-ref>=thr){up+=v-ref;ref=v;}else if(ref-v>=thr){dn+=ref-v;ref=v;}
    cu.push(up);cd.push(dn);
  }

}
function buildProfile(pts){
  const cum=cumDist(pts),total=cum[cum.length-1],ec=elevCum(pts);
  const N=Math.min(220,Math.max(2,pts.length));
  const d=[],e=[],la=[],lo=[],ug=[],dg=[];let j=0;

    const t=Math.min(1,Math.max(0,(target-cum[j])/span));

    e.push(pts[j].ele+(pts[j+1].ele-pts[j].ele)*t);
    ug.push(Math.round((ec.cu[j]+(ec.cu[j+1]-ec.cu[j])*t)*10)/10);dg.push(Math.round((ec.cd[j]+(ec.cd[j+1]-ec.cd[j])*t)*10)/10);
    la.push(Math.round((pts[j].lat+(pts[j+1].lat-pts[j].lat)*t)*1e5)/1e5);
    lo.push(Math.round((pts[j].lon+(pts[j+1].lon-pts[j].lon)*t)*1e5)/1e5);
  }
  const sm=e.map((v,i)=>{let s=0,c=0;for(let q=-2;q<=2;q++){const x=e[i+q];if(x!==undefined){s+=x;c++;}}return s/c;});
  return {d,e:sm.map(Math.round),la,lo,ug,dg};
}
function profileStats(p){let up=0,down=0;if(p.ug&&p.dg&&p.ug.length===p.e.length){up=p.ug[p.ug.length-1];down=p.dg[p.dg.length-1];}else for(let i=1;i<p.e.length;i++){const dz=p.e[i]-p.e[i-1];if(dz>0)up+=dz;else down-=dz;}return {km:p.d[p.d.length-1],up:Math.round(up),down:Math.round(down),min:Math.min(...p.e),max:Math.max(...p.e)};}
function legStats(p,a,b){
  if(p.ug&&p.dg&&p.ug.length===p.d.length)return {up:Math.round(Math.max(0,interp(p.d,p.ug,b)-interp(p.d,p.ug,a))),down:Math.round(Math.max(0,interp(p.d,p.dg,b)-interp(p.d,p.dg,a)))};
  const ea=interp(p.d,p.e,a),eb=interp(p.d,p.e,b);let up=0,down=0,prev=ea;
  for(let i=0;i<p.d.length;i++){if(p.d[i]>a&&p.d[i]<b){const dz=p.e[i]-prev;if(dz>0)up+=dz;else down-=dz;prev=p.e[i];}}
  const dz=eb-prev;if(dz>0)up+=dz;else down-=dz;
  return {up:Math.round(up),down:Math.round(down)};
}
function gradeFactor(i){

  const a=-i;return a<=0.10?1-1.5*a:0.85+(a-0.10)*2.5;
}
function unitCum(p,drift){
  const n=p.d.length,tot=p.d[n-1],U=[0],hid=!!(p.ug&&p.dg&&p.ug.length===n&&p.dg.length===n);
  for(let i=1;i<n;i++){
    const dk=p.d[i]-p.d[i-1];if(dk<=0){U.push(U[i-1]);continue;}
    const g=Math.max(-0.4,Math.min(0.4,(p.e[i]-p.e[i-1])/(dk*1000)));
    const mid=((p.d[i]+p.d[i-1])/2)/tot;
    let inc=dk*gradeFactor(g)*(1+(drift/100)*Math.pow(mid,1.5));
    if(hid){
      // dénivelé réel de ce tronçon moins celui que voit le profil lissé = petites bosses cachées
      // (environ 6,4 m d'effort en plus par mètre grimpé, 1,5 m économisés par mètre descendu, à 8 %)
      const dz=p.e[i]-p.e[i-1],hu=Math.max(0,(p.ug[i]-p.ug[i-1])-Math.max(dz,0)),hd=Math.max(0,(p.dg[i]-p.dg[i-1])-Math.max(-dz,0));

function parseHM(s){const m=/^\s*(\d{1,3})\s*[:hH]\s*(\d{1,2})?\s*$/.exec(s||'');if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(mi>59)return null;return h*60+mi;}
function parseClock(s){const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');if(!m)return null;return (+m[1])*60+(+m[2]);}
function pad2(n){return String(n).padStart(2,'0');}
function fmtHM(min){const m=Math.round(min);return Math.floor(m/60)+':'+pad2(m%60);}
function fmtDur(min){const m=Math.round(Math.max(0,min));return Math.floor(m/60)+'h'+pad2(m%60);}
function fmtClock(min){const m=Math.round(min);const day=Math.floor(m/1440);const r=((m%1440)+1440)%1440;return {s:pad2(Math.floor(r/60))+':'+pad2(r%60),day};}
function fmtPace(x){let m=Math.floor(x),s=Math.round((x-m)*60);if(s===60){m++;s=0;}return m+':'+pad2(s);}
function model(race){
  const p=race.profile,tot=p.d[p.d.length-1];
  const U=unitCum(p,0);
  const stations=race.stations.slice().sort((a,b)=>a.km-b.km).filter(s=>s.km>0&&s.km<tot);
  const target=parseHM(race.target)||0;
  const stopsTotal=stations.length*(+race.stopMin||0);
  const moving=Math.max(1,target-stopsTotal);
  const basePace=moving/U[U.length-1];
  const M=km=>interp(p.d,U,km)*basePace;
  const startMin=parseClock(race.start)||0;
  const start0=(race.startAt!=null&&isFinite(+race.startAt))?+race.startAt:startMin;
  return {p,tot,U,stations,target,basePace,M,moving,stopsTotal,startMin,start0};
}
function timeline(race,m,opts){
  opts=opts||{};
  const mult=opts.mult||1;
  const pts=opts.plan?{}:(race.points||{});
  const fx=opts.plan?null:race.fix;
  const stop=Math.max(0,+race.stopMin||0);
  const s0=opts.plan?m.startMin:m.start0;
  const seq=m.stations.map(s=>({id:s.id,name:s.name||'Ravito',km:s.km,stop:stop,st:s,isFinish:false}))
    .concat([{id:'finish',name:'Arrivée',km:m.tot,stop:0,st:null,isFinish:true}]);
  let ref=-1;seq.forEach((s,i)=>{if(pts[s.id]!=null)ref=i;});
  let Dref=s0,dref=0,Mref=0;
  if(ref>=0){const s=seq[ref],A=pts[s.id];Dref=A+s.stop;dref=s.km;Mref=m.M(s.km);}
  let useFix=false;
  if(fx&&isFinite(fx.km)&&isFinite(fx.t)&&fx.km>0&&fx.km<=m.tot&&(ref<0||(fx.km>=dref&&fx.t>=Dref)))useFix=true;
  if(useFix){dref=fx.km;Dref=fx.t;Mref=m.M(fx.km);}
  // Étalonnage : on compare, tronçon par tronçon, le temps réel au temps prévu entre les passages connus
  // (départ, ravitos pointés, position). Les derniers tronçons pèsent davantage : un coureur qui ralentit
  // voit ses prochaines heures repoussées en conséquence.
  let f=1,nLegs=0;
  {
    const obs=[{km:0,t:s0,st:false}];
    seq.forEach(s=>{if(pts[s.id]!=null)obs.push({km:s.km,t:pts[s.id],st:!s.isFinish});});
    if(useFix)obs.push({km:fx.km,t:fx.t,st:false});
    obs.sort((a,b)=>a.km-b.km);
    let sw=0,swr=0;
    for(let j=1;j<obs.length;j++){
      const a=obs[j-1],b=obs[j];
      if(b.km<=a.km+1e-6||b.t<=a.t)continue;
      const pm=m.M(b.km)-m.M(a.km);
      let ns=0;
      for(const s of seq){if(s.isFinish)continue;if(s.km<b.km-1e-6&&(s.km>a.km+1e-6||(a.st&&Math.abs(s.km-a.km)<1e-6)))ns++;}
      const am=(b.t-a.t)-ns*stop;
      if(pm<0.5||am<0.2)continue;
      nLegs++;
      const w=pm*(1+nLegs);
      sw+=w;swr+=w*Math.max(0.5,Math.min(2.5,am/pm));
    }
    if(sw>0){
      const rw=swr/sw,obsKm=obs[obs.length-1].km,c=Math.min(1,0.5+0.5*obsKm/Math.max(5,0.1*m.tot));

    }
  }
  const stopsBetween=km=>{let c=0;for(const s of seq){if(!s.isFinish&&s.km>dref&&s.km<km)c++;}return c*stop;};

  const Tplan=km=>{let c=0;for(const s of seq){if(!s.isFinish&&s.km<km)c++;}return m.startMin+m.M(km)+c*stop;};

    const plannedArr=Tplan(s.km);
    const actual=pts[s.id]!=null?pts[s.id]:null;
    const passedEst=actual==null&&(ref>=0||useFix)&&!s.isFinish&&s.km<dref;
    const adjArr=actual!=null?actual:(passedEst?s0+m.M(s.km)*f+i*stop:T(s.km));
    let bar=null;const bs=s.isFinish?race.finishBarrier:(s.st&&s.st.barrier);

    return {id:s.id,name:s.name,km:s.km,stop:s.stop,isFinish:s.isFinish,st:s.st,index:i,plannedArr,actual,passedEst,adjArr,dep:adjArr+s.stop,barrier:bar,margin:bar!=null?bar-adjArr:null};
  });
  function kmAt(now){
    if((ref>=0||useFix)&&now<=Dref)return dref;
    if(ref<0&&now<=s0)return 0;
    let lo=dref,hi=m.tot;
    if(now>=T(hi))return hi;
    for(let k=0;k<40;k++){const mid=(lo+hi)/2;if(T(mid)<now)lo=mid;else hi=mid;}
    return hi;
  }
  return {rows,ref,f,kmAt,useFix,nLegs};
}
function legs(race,m){
  const tl=timeline(race,m,{plan:true}),out=[];
  let pk=0,pd=m.startMin,pn='Départ';
  tl.rows.forEach(r=>{out.push(Object.assign({from:pn,to:r.name,km0:pk,km1:r.km,km:r.km-pk,dur:r.adjArr-pd},legStats(m.p,pk,r.km)));pk=r.km;pd=r.dep;pn=r.name;});
  return out;
}
function autoBarrier(race,km){
  const st=parseClock(race.start)||0,sp=(+race.minSpeed>0)?+race.minSpeed:5.5;
  return fmtClock(Math.round(st+km/sp*60)).s;
}
function nutr(r,k){
  const d={carbs:60,water:500,sodium:400,gelG:25,barG:30,gelShare:70},v=r[k];
  return (v===undefined||v===null||v===''||isNaN(+v))?d[k]:+v;
}
function needsFor(r,durMin){
  const h=Math.max(0,durMin)/60,carbs=h*nutr(r,'carbs'),share=Math.max(0,Math.min(100,nutr(r,'gelShare')))/100;
  const gelG=nutr(r,'gelG'),barG=nutr(r,'barG');
  return {
    carbs:Math.round(carbs),
    gels:gelG>0?Math.ceil(carbs*share/gelG-1e-6):0,
    bars:barG>0?Math.ceil(carbs*(1-share)/barG-1e-6):0,
    water:Math.ceil(h*nutr(r,'water')/50-1e-6)*50,
    sodium:Math.round(h*nutr(r,'sodium')/10)*10

}
function assistSegments(race,m,tl){
  const pts=[{id:'start',name:'Départ',km:0,arr:m.startMin,dep:m.startMin,access:true}];
  tl.rows.forEach(r=>{pts.push({id:r.id,name:r.name,km:r.km,arr:r.adjArr,dep:r.dep,access:r.isFinish||!!(r.st&&r.st.access)});});

  for(let i=0;i<acc.length-1;i++){
    const a=acc[i],b=acc[i+1],dur=b.arr-a.dep;
    out.push(Object.assign({from:a.name,fromId:a.id,to:b.name,toId:b.id,km:b.km-a.km,dur:dur,
      via:pts.filter(x=>!x.access&&x.km>a.km&&x.km<b.km).map(x=>x.name),needs:needsFor(race,dur)},legStats(m.p,a.km,b.km)));

}
function demoProfile(){
  const keys=[[0,1000],[4,1100],[11,1900],[15,1700],[19,1250],[24,1500],[27,2050],[31,1700],[34,1100],[38,1180],[42.2,1000]];
  const xs=keys.map(k=>k[0]),ys=keys.map(k=>k[1]);const n=200,tot=42.2,d=[],e=[];
  const la=[],lo=[];
  for(let i=0;i<n;i++){const km=tot*i/(n-1);d.push(Math.round(km*1000)/1000);e.push(Math.round(interp(xs,ys,km)+12*Math.sin(km*2.3)));la.push(Math.round((45+0.004*Math.sin(km/3))*1e5)/1e5);lo.push(Math.round((3+km*0.0127)*1e5)/1e5);}
  return {d,e,la,lo};
}
function matchKm(profile,lat,lon,hintKm){
  const la=profile.la,lo=profile.lo,d=profile.d;
  if(!la||!lo||la.length!==d.length||d.length<2)return null;
  const cl=Math.cos(lat*Math.PI/180),cands=[];
  for(let i=1;i<d.length;i++){
    const ax=(lo[i-1]-lon)*cl*111320,ay=(la[i-1]-lat)*110540,bx=(lo[i]-lon)*cl*111320,by=(la[i]-lat)*110540;
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=L2>0?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx,py=ay+t*dy;

  const best=a=>a.reduce((m,c)=>(!m||c.dist<m.dist)?c:m,null);

  if(hintKm!=null){const w=best(cands.filter(c=>c.km>=hintKm-1&&c.km<=hintKm+25));if(w&&w.dist<=300)b=w;}
  if(!b){const g=best(cands);if(g&&g.dist<=300)b=g;}

// Cherche le stationnement le plus proche de chaque ravito accessible, puis le temps de voiture entre ravitos.
// opts.onlyId : un seul ravito (on écrase ses valeurs) ; opts.driveOnly : on ne recalcule que les trajets.
async function crewAuto(r,opts){
  opts=opts||{};
  const prov=routeProvider();
  if(!prov.auto)throw new Error('Aucun service de recherche n’est activé.');
  if(!gpsAvailable(r))throw new Error('Ce plan n’a pas de coordonnées GPS : réimporte le fichier GPX pour utiliser la recherche.');
  const tot=r.profile.d[r.profile.d.length-1];
  const accs=r.stations.filter(s=>s.access&&s.km>0&&s.km<tot).sort((x,y)=>x.km-y.km);
  if(!accs.length)throw new Error('Aucun ravito avec accès pour l’assistance.');
  const touched={};let fails=0;
  const alive=()=>state.race===r&&!crewRun.cancel;
  const safe=async fn=>{try{const v=await fn();fails=0;return v;}catch(e){fails++;if(fails>=2){crewRun.diag=osmDiag.slice();throw new Error(navigator.onLine===false?'Pas de réseau : lance la recherche chez toi, avec du réseau.':'Le service OpenStreetMap ne répond pas pour le moment. Réessaie plus tard ou saisis les valeurs à la main.');}return null;}};
  // 1. stationnements
  if(!opts.driveOnly){
    for(const s of accs){
      if(!alive())break;
      if(opts.onlyId&&s.id!==opts.onlyId)continue;
      const ll=pointAtKm(r.profile,s.km);
      const wantParking=opts.onlyId?true:(s.parkAuto===true||(!s.parking&&s.parkLat==null));
      if(!wantParking){
        if(s.parkLat!=null&&s.walkMin==null){
          crewLog('Marche jusqu’à « '+s.name+' »…');
          const w=await safe(()=>prov.travelMin({from:{lat:s.parkLat,lon:s.parkLon},to:ll,mode:'walk'}));
          if(w!=null){s.walkMin=w;s.walkEst=false;}else if(w===null&&s.walkMin==null){s.walkMin=estWalkMin(distM({lat:s.parkLat,lon:s.parkLon},ll));s.walkEst=true;}
        }
        continue;
      }
      crewLog('Recherche d’un stationnement près de « '+s.name+' » (km '+km1(s.km)+')…');
      let cands=[];
      for(const R of [250,500,1000,1800]){
        if(!alive())break;
        const c=await safe(()=>prov.findParking({lat:ll.lat,lon:ll.lon,radiusM:R}));
        if(c)cands=c;
        if(cands.length>=3)break;
      }
      if(!alive())break;
      if(!cands.length){crewLog('Aucun stationnement trouvé près de « '+s.name+' » : saisis-le à la main.');continue;}
      const top=cands.slice(0,3);
      for(const c of top){
        if(!alive())break;
        const w=await safe(()=>prov.travelMin({from:c,to:ll,mode:'walk'}));
        if(w!=null){c.walkMin=w;c.est=false;}else{c.walkMin=estWalkMin(c.distM);c.est=true;}
      }
      if(!alive())break;
      const ranked=pickParking(top),best=ranked[0];
      s.parking=parkLabel(best);s.parkLat=best.lat;s.parkLon=best.lon;s.walkMin=best.walkMin;s.walkEst=!!best.est;s.parkAuto=true;
      s.parkAlt=ranked.slice(1,3).map(c=>({name:parkLabel(c),lat:c.lat,lon:c.lon,walkMin:c.walkMin,est:!!c.est}));
      touched[s.id]=true;
      crewLog('« '+s.name+' » : '+s.parking+', '+s.walkMin+' min à pied'+(best.est?' (estimé)':'')+(best.src==='nominatim'?' · service de secours, accès au parking à vérifier':'')+'.');
    }
  }
  // 2. trajets en voiture : de parking en parking, en partant du départ de la course
  if(alive()){
    let prev=pointAtKm(r.profile,0),prevTouched=false;
    for(const s of accs){
      if(!alive())break;
      const dest=(s.parkLat!=null&&s.parkLon!=null)?{lat:s.parkLat,lon:s.parkLon}:pointAtKm(r.profile,s.km);
      const manual=s.parkAuto===false&&s.driveMin!=null&&!(opts.onlyId&&s.id===opts.onlyId);
      const need=!manual&&(touched[s.id]||prevTouched||s.driveMin==null||(opts.driveOnly&&s.parkAuto!==false));
      if(need){
        crewLog('Trajet en voiture jusqu’à « '+s.name+' »…');
        const v=await safe(()=>prov.travelMin({from:prev,to:dest,mode:'drive'}));
        if(v!=null){s.driveMin=v;}else if(v===null){crewLog('Pas d’itinéraire trouvé jusqu’à « '+s.name+' » : saisis le trajet à la main.');}
      }
      prevTouched=!!touched[s.id]||(need&&!manual);
      prev=dest;
    }
  }
}
// Test de connexion : dit quel service répond, avec le code d'erreur sinon (utile si la recherche échoue).
async function crewTest(){
  if(crewRun.running)return;
  crewRun={running:true,cancel:false,lines:[],err:'',diag:[],test:['Test en cours…']};setCrewStatus();
  const out=[],ping=async(label,url,opt)=>{
    const t0=Date.now(),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
    try{const r=await fetch(url,Object.assign({signal:ctl.signal},opt||{}));const ms=Date.now()-t0;if(!r.ok)out.push('✖ '+label+' : HTTP '+r.status+' ('+ms+' ms)');else{try{await r.text();}catch(e){}out.push('✔ '+label+' : répond en '+ms+' ms');}}
    catch(e){out.push('✖ '+label+' : '+osmWhy(e));}
    finally{clearTimeout(to);}
    crewRun.test=out.slice();setCrewStatus();
  };
  const q='data='+encodeURIComponent('[out:json][timeout:10];node["amenity"="parking"](around:300,48.8566,2.3522);out center 1;');

  await ping('Itinéraires voiture, routing.openstreetmap.de',osrmUrl('drive',{lat:48.8566,lon:2.3522},{lat:48.8606,lon:2.3376}));
  await ping('Itinéraires à pied, routing.openstreetmap.de',osrmUrl('walk',{lat:48.8566,lon:2.3522},{lat:48.8606,lon:2.3376}));
  crewRun.running=false;crewRun.test=out.concat(['Envoie-moi ces lignes si un service ne répond pas.']);setCrewStatus();
}

// ---------- import GPX ----------
function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Fichier illisible. Vérifie que c’est bien un GPX.');
  let nodes=Array.prototype.slice.call(doc.getElementsByTagName('trkpt'));
  if(nodes.length<2)nodes=Array.prototype.slice.call(doc.getElementsByTagName('rtept'));
  if(nodes.length<2)throw new Error('Aucune trace trouvée dans ce fichier.');
  const pts=[];let withEle=0,last=0;
  nodes.forEach(n=>{
    const lat=parseFloat(n.getAttribute('lat')),lon=parseFloat(n.getAttribute('lon'));
    if(isNaN(lat)||isNaN(lon))return;
    const el=n.getElementsByTagName('ele')[0];let ele=el?parseFloat(el.textContent):NaN;
    if(isNaN(ele))ele=last;else{withEle++;last=ele;}
    pts.push({lat,lon,ele});
  });
  if(pts.length<2)throw new Error('Trace vide.');
  if(withEle<pts.length*0.5)throw new Error('Ce fichier ne contient pas d’altitude, impossible de calculer le dénivelé.');
  const cum=cumDist(pts),total=cum[cum.length-1];
  if(total<1)throw new Error('Tracé trop court (moins de 1 km).');
  const profile=buildProfile(pts);
  const wps=[];
  Array.prototype.slice.call(doc.getElementsByTagName('wpt')).forEach(w=>{
    const lat=parseFloat(w.getAttribute('lat')),lon=parseFloat(w.getAttribute('lon'));if(isNaN(lat)||isNaN(lon))return;
    let best=1e9,bi=0;for(let i=0;i<pts.length;i+=Math.max(1,Math.floor(pts.length/3000))){const dd=hav({lat,lon},pts[i]);if(dd<best){best=dd;bi=i;}}
    const nm=w.getElementsByTagName('name')[0];
    if(best<0.3&&cum[bi]>0.5&&cum[bi]<total-0.5)wps.push({name:nm?nm.textContent.trim().slice(0,60):'Ravito',km:cum[bi]});
  });
  wps.sort((a,b)=>a.km-b.km);
  const ded=[];wps.forEach(w=>{if(!ded.length||w.km-ded[ded.length-1].km>0.3)ded.push(w);});
  const trk=doc.getElementsByTagName('trk')[0];
  const tn=trk?trk.getElementsByTagName('name')[0]:null;
  return {profile,waypoints:ded.slice(0,12),name:tn?tn.textContent.trim().slice(0,80):''};
}
function loadGPXText(text,fname){
  try{
    const res=parseGPX(String(text));
    const name=res.name||String(fname||'Ma course').replace(/\.gpx$/i,'');
    const st=res.waypoints.map(w=>({id:uid(),name:w.name||'Ravito',km:Math.round(w.km*10)/10,access:true,barrier:'',items:[]}));

function applyRemote(r,doc){
  const before=pstr(r.points)+'|'+r.sync.lastPlan+'|'+JSON.stringify(r.fix||null)+'|'+r.startAt+'|'+JSON.stringify([r.extras||{},r.done||{}]);
  const f=doc.fields||{};

    const v=mf[k];

    else if(id.indexOf('d:')===0){const k=id.slice(2);if(pend[id]==null)delete done[k];else done[k]=1;}
    else if(pend[id]==null)delete merged[id];else merged[id]=pend[id];

  r.startAt=(merged.startat!=null)?merged.startat:null;delete merged.startat;

}

function zoneEstimate(pf,r){
  const tm=parseTimeMin(pf.refTime),dm=+pf.refDist;
  if(!r||!(dm>0)||!tm)return null;
  const zones=paceZones(vdotFrom(dm*1000,tm)),z=zones.find(x=>x.id===pf.applyZone)||zones[1];
  const m=model(r),U=m.U[m.U.length-1],bp=(z.fast+z.slow)/2;
  return {zone:z,total:Math.round((bp*U+m.stopsTotal)/5)*5,basePace:bp};
}

  document.getElementById('tourextra').innerHTML=s0.final?'<div class="row" style="margin:10px 0 4px"><button class="btn" data-tour="demo">Lancer la course démo</button>'+gpxPick('','Importer mon GPX')+'</div>':'';
  positionTour();

function positionTour(){
  if(!tourOn)return;
  const s0=tourList[tourI],hl=document.getElementById('tourhl'),card=document.getElementById('tourcard'),tr=document.getElementById('tour');
  // On mesure par rapport au calque du guide lui-même (et non à window.innerHeight) : sur Android, les deux peuvent différer
  // quand les barres du système apparaissent ou disparaissent.
  const box=tr.getBoundingClientRect(),vw=box.width,vh=box.height;
  const el=s0.target?document.querySelector(s0.target):null;
  const rc=el&&!el.hidden?el.getBoundingClientRect():null;
  card.style.transform='none';
  if(rc&&rc.width>0&&rc.height>0){
    // Le cadre reste entièrement visible : à l'intérieur de la barre pour les onglets, autour de l'élément sinon.
    const pad=el.closest('.tabs')?-2:5;
    let L=rc.left-box.left-pad,T=rc.top-box.top-pad,W=rc.width+2*pad,H=rc.height+2*pad;
    L=Math.max(3,L);T=Math.max(3,T);W=Math.min(W,vw-3-L);H=Math.min(H,vh-3-T);
    hl.classList.remove('none');
    hl.style.left=L+'px';hl.style.top=T+'px';hl.style.width=W+'px';hl.style.height=H+'px';
    if(T>vh/2){card.style.top='auto';card.style.bottom=(vh-T+14)+'px';card.style.maxHeight=Math.max(160,T-14-12)+'px';}
    else{card.style.bottom='auto';card.style.top=(T+H+14)+'px';card.style.maxHeight=Math.max(160,vh-(T+H+14)-12)+'px';}
  }else{
    hl.classList.add('none');
    hl.style.left=(vw/2)+'px';hl.style.top=(vh*0.45)+'px';hl.style.width='0px';hl.style.height='0px';
    card.style.bottom='auto';card.style.top='50%';card.style.transform='translateY(-50%)';card.style.maxHeight=(vh-24)+'px';
  }
}
// Tant que le guide est ouvert, on revérifie la position à chaque image : si la mise en page bouge après coup
// (barres du système, polices, défilement), le cadre suit l'élément au lieu de rester à une position périmée.
let tourSig='',tourRaf=0;
function tourLoop(){
  if(!tourOn){tourRaf=0;return;}
  const s0=tourList[tourI],tr=document.getElementById('tour'),el=s0&&s0.target?document.querySelector(s0.target):null;
  let sig='';
  if(tr){const b=tr.getBoundingClientRect();sig=Math.round(b.width)+'x'+Math.round(b.height);}
  if(el&&!el.hidden){const r=el.getBoundingClientRect();sig+='|'+[r.left,r.top,r.width,r.height].map(Math.round).join(',');}
  if(sig!==tourSig){tourSig=sig;positionTour();}
  tourRaf=requestAnimationFrame(tourLoop);
}
function endTour(){
  if(!tourOn)return;
  tourOn=false;document.getElementById('tour').hidden=true;document.body.classList.remove('touring');
  if(!landOpen)document.body.classList.remove('noscroll');

function tourAct(k){

  if(k==='prev'){if(tourI>0){tourI--;showTourStep();}return;}
  if(k==='skip'){endTour();return;}
  if(k==='demo'){tourTemp=false;state.tmpRace=false;endTour();state.race=demoRace();animateNext=true;tab='plan';commit();window.scrollTo(0,0);return;}
}

function isMember(r){return !!(r&&r.sync&&r.sync.role==='member');}
function itemLabel(it){return (it.q>1?it.q+' × ':'')+it.t;}
function normLabel(t){return String(t||'').trim().toLowerCase();}
function parseItemInput(text,qty){
  let t=String(text||'').trim(),q=Math.max(1,Math.min(99,parseInt(qty,10)||1));
  const m=/^(\d{1,2})\s*[x×]?\s+(.+)$/i.exec(t);
  if(m){q=Math.max(1,parseInt(m[1],10));t=m[2].trim();}
  return {t:t.slice(0,60),q:q};
}
function ensureItems(r){
  r.extras=r.extras||{};r.done=r.done||{};
  r.stations.forEach(s=>{
    s.items=(s.items||[]).map(it=>{
      const id=it.id||uid();
      if(it.done&&r.done[id]==null)r.done[id]=1;
      return {id:id,t:String(it.t||'').slice(0,60),q:Math.max(1,parseInt(it.q,10)||1),cat:it.cat||'autre'};
    });
  });
}
function addItem(r,stId,text,qty,cat){
  const it=parseItemInput(text,qty);if(!it.t)return false;
  if(isMember(r)){
    const dup=Object.keys(r.extras||{}).find(k=>r.extras[k].s===stId&&normLabel(r.extras[k].t)===normLabel(it.t));
    r.extras=r.extras||{};
    if(dup){r.extras[dup].q=Math.min(99,r.extras[dup].q+it.q);queuePoint(r,'x:'+dup,JSON.stringify(r.extras[dup]));}
    else{const id=uid();r.extras[id]={s:stId,t:it.t,q:it.q,cat:cat||'autre'};queuePoint(r,'x:'+id,JSON.stringify(r.extras[id]));}
  }else{
    const s=r.stations.find(x=>x.id===stId);if(!s)return false;
    s.items=s.items||[];
    const dup=s.items.find(x=>normLabel(x.t)===normLabel(it.t));
    if(dup)dup.q=Math.min(99,dup.q+it.q);else s.items.push({id:uid(),t:it.t,q:it.q,cat:cat||'autre'});
  }
  return true;
}

async function checkPerms(){

    else if(navigator.permissions&&navigator.permissions.query){permState.loc=(await navigator.permissions.query({name:'geolocation'})).state;}
  }catch(e){}
  try{if(N&&N.LocalNotifications)permState.notif=(await N.LocalNotifications.checkPermissions()).display;}catch(e){}
  updatePermUI();
}
async function ensurePermissions(){
  const N=window.RubaliseNative;
  try{
    if(N&&N.Geolocation){
      let p=await N.Geolocation.checkPermissions();
      if(p.location!=='granted')p=await N.Geolocation.requestPermissions({permissions:['location','coarseLocation']});
      permState.loc=p.location;
    }else if(navigator.geolocation){
      permState.loc=await new Promise(res=>navigator.geolocation.getCurrentPosition(()=>res('granted'),e=>res(e.code===1?'denied':'prompt'),{timeout:10000,maximumAge:600000}));
    }
  }catch(e){permState.loc='denied';}
  try{
    if(N&&N.LocalNotifications){
      let p=await N.LocalNotifications.checkPermissions();
      if(p.display!=='granted')p=await N.LocalNotifications.requestPermissions();
      permState.notif=p.display;
    }
  }catch(e){}
  updatePermUI();return permState;
}

  return gpsOn?(gpsMsg||'Suivi GPS actif : en attente d’un signal.'):((r&&r.gpsArmed)?'GPS armé : il démarrera automatiquement quand le départ sera donné. Garde l’appli ouverte à ce moment-là : sinon il démarre à la réouverture.':'');
}
let gpsStarting=false;
function maybeAutoGps(){
  const r=state.race;
  if(!r||!r.gpsArmed||gpsOn||gpsStarting||document.hidden||!r.sync||r.sync.role!=='owner'||r.startAt==null)return;
  if(r.points&&r.points.finish!=null)return;

async function gpsStart(){

  if(!gpsAvailable(r)){flash('Ce tracé n’a pas de coordonnées GPS : réimporte le fichier GPX.');return;}
  const ps=await ensurePermissions();
  if(ps.loc==='denied'){flash('Localisation refusée. Autorise-la pour Rubalise : bouton « Ouvrir les réglages du téléphone ».');commit();return;}
  gpsOn=true;gpsSentAt=0;gpsSentKm=-1;gpsMsg='';gpsOkTxt='';
  const N=nativeGeo();
  try{
    if(N){
      gpsMode='native';
      gpsWatch=await N.BackgroundGeolocation.addWatcher({backgroundTitle:'Rubalise : suivi de course',backgroundMessage:'Ton kilomètre sur le parcours est partagé avec ton assistance.',requestPermissions:true,stale:false,distanceFilter:40},(loc,err)=>{
        if(err){setGpsStatus(err.code==='NOT_AUTHORIZED'?'Localisation refusée : autorise-la pour Rubalise dans les réglages du téléphone.':'Erreur GPS : '+(err.message||err.code));return;}

    }else{gpsOn=false;flash('Ce téléphone ne permet pas la localisation.');return;}
  }catch(e){gpsOn=false;gpsMode='';flash('Impossible de démarrer le GPS : '+(e.message||e));return;}

}
async function gpsStop(){
  if(!gpsOn)return;
  const mode=gpsMode,w=gpsWatch;gpsOn=false;gpsMode='';gpsWatch=null;gpsMsg='';

    if(mode==='native'){const N=nativeGeo();if(N)await N.BackgroundGeolocation.removeWatcher({id:w});}

}
function onGps(lat,lon,acc){
  const r=state.race;
  if(!gpsOn||!r||!r.sync||r.sync.role!=='owner')return;
  if(typeof lat!=='number'||typeof lon!=='number')return;
  if(acc&&acc>200){setGpsStatus('Signal GPS imprécis (±'+Math.round(acc)+' m) : en attente d’un meilleur signal.');return;}
  const mt=matchKm(r.profile,lat,lon,(r.fix&&r.fix.src)?r.fix.km:null);
  if(!mt){setGpsStatus('Tu sembles hors du parcours (à plus de 300 m du tracé). Rien n’est envoyé.');return;}
  const now=Date.now(),arrived=mt.km>=r.profile.d[r.profile.d.length-1]-0.05;
  if(!arrived&&(now-gpsSentAt<gpsGap()||(now-gpsSentAt<2.5*gpsGap()&&Math.abs(mt.km-gpsSentKm)<0.1))){
    if(gpsOkTxt&&gpsMsg!==gpsOkTxt)setGpsStatus(gpsOkTxt);
    return;
  }
  const m=Math.round(nowMin(r)),km=Math.round(mt.km*100)/100;
  setFix(r,km,m,1);gpsSentAt=now;gpsSentKm=mt.km;save();syncSoon();
  gpsOkTxt='Position envoyée : km '+km1(km)+' à '+fmtClock(m).s+(acc?' (précision ±'+Math.round(acc)+' m)':'')+'.';
  setGpsStatus(gpsOkTxt);
  if(arrived){r.gpsArmed=false;gpsStop();flash('Arrivée atteinte : suivi GPS arrêté.');}
}
function gpsPanel(r){

    +'<p class="note">Ton téléphone envoie ton kilomètre sur le parcours à ton assistance, toutes les 2 minutes environ (réglable ci-dessous). Seul le kilomètre est partagé, jamais tes coordonnées. Le GPS consomme de la batterie et n’envoie rien sans réseau. Pour économiser la batterie, choisis « Activer au départ » : il ne démarre que lorsque le départ est donné et s’arrête à l’arrivée.</p>';
  if(!owner)t+='<p class="note" id="permstat">'+esc(permText())+'</p><p class="note">Partage d’abord ta course en direct (section « Suivi en direct » ci-dessus).</p>';
  else if(!gpsAvailable(r))t+='<p class="warn">Ce tracé n’a pas de coordonnées GPS (importé avec une ancienne version). Réimporte le fichier GPX pour activer cette fonction.</p>';
  else t+='<div class="row">'+(gpsOn?'<button class="btn danger" data-act="gps-stop">Arrêter le suivi GPS</button>'
      :(r.gpsArmed?'<button class="btn" data-act="gps-disarm">Désarmer</button><button class="btn quiet" data-act="gps-start">Démarrer maintenant</button>'

    +'<p class="note" id="gpsstat">'+esc(gpsText())+'</p>'
    +'<label class="fld" style="margin-top:8px"><span>Fréquence d’envoi de ta position</span><select class="in" data-gpsevery>'
    +[['auto','Automatique (2 min, plus espacé si la batterie baisse)'],['60','Toutes les minutes'],['120','Toutes les 2 minutes'],['300','Toutes les 5 minutes'],['600','Toutes les 10 minutes']].map(o=>'<option value="'+o[0]+'"'+(String((state.prefs&&state.prefs.gpsEvery)||'auto')===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'
    +'<p class="note">Envoyer une position toutes les 15 à 40 secondes garde la radio mobile presque tout le temps allumée : Android le déconseille. À 8 km/h, 2 minutes représentent environ 270 m, largement assez pour ton assistance. Espace davantage si ta batterie est juste.</p>'
    +'<p class="note" id="permstat">'+esc(permText())+'</p><div class="row"><button class="btn quiet small" data-act="perm-request">Autoriser la localisation</button>'+(nativeGeo()?'<button class="btn quiet small" data-act="perm-settings">Ouvrir les réglages du téléphone</button>':'')+'</div>'

}

// ---------- graphique de profil ----------
function profileSVG(m,tl,opt){
  const W=opt.w,H=opt.h||200,L=(opt.hit?60:46),R=10,T=24,B=24,p=m.p,tot=m.tot;
  const minE=Math.min(...p.e),maxE=Math.max(...p.e),pad=Math.max(20,(maxE-minE)*0.1),y0=minE-pad,y1=maxE+pad;
  const X=k=>L+(k/tot)*(W-L-R),Y=e=>H-B-((e-y0)/(y1-y0))*(H-T-B);
  let line='';p.d.forEach((k,i)=>{line+=(i?'L':'M')+X(k).toFixed(1)+','+Y(p.e[i]).toFixed(1);});
  const area=line+'L'+X(tot).toFixed(1)+','+(H-B)+'L'+X(0).toFixed(1)+','+(H-B)+'Z';
  const step=tot>70?10:tot>28?5:2;
  let g='';
  [maxE,minE].forEach(v=>{const rv=Math.round(v/10)*10;g+='<line class="pf-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="pf-txt" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+rv+' m</text>';});
  let lastK=0;for(let k=0;k<=tot+0.001;k+=step)lastK=k;
  for(let k=0;k<=tot+0.001;k+=step){g+='<text class="pf-txt" x="'+X(k).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+k+(k===lastK?' km':'')+'</text>';}
  let s='';let n=0;
  tl.rows.forEach(r=>{
    if(r.isFinish)return;n++;
    const x=X(r.km),y=Y(interp(p.d,p.e,r.km));
    s+='<line class="pf-dash" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(T-6)+'" y2="'+(H-B)+'"/>';
    const fillc=(r.st&&r.st.access?'var(--accent)':'var(--bg)');
    if(opt.hit){
      const sel=opt.sel===r.id;
      s+='<g class="pf-hit" data-hit="'+r.id+'" role="button" tabindex="0" aria-label="Ravito '+n+', '+esc(r.name)+', kilomètre '+km1(r.km)+'"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="20" fill="transparent"/>'
        +'<circle class="pf-stn" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(sel?10:7)+'" fill="'+fillc+'"'+(sel?' style="stroke:var(--live);stroke-width:3.5px"':'')+'/></g>';
    }else{
      s+='<circle class="pf-stn" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="'+fillc+'"/>';
    }
    s+='<text class="pf-num" x="'+x.toFixed(1)+'" y="'+(T-10)+'" text-anchor="middle">'+n+'</text>';
  });
  let live='';
  if(opt.kmNow!=null){
    const x=X(opt.kmNow),y=Y(interp(p.d,p.e,opt.kmNow));
    live='<line class="pf-live" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(T-6)+'" y2="'+(H-B)+'"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--live)" stroke="var(--bg)" stroke-width="2.5"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Profil d’élévation du parcours"><path class="pf-area" d="'+area+'"/><path class="pf-line'+(opt.anim?' draw':'')+'" pathLength="1000" d="'+line+'"/>'+g+s+live+'</svg>';
}

function crewLine(r,st){

  const dest=hasC?st.parkLat+','+st.parkLon:(st.parking?encodeURIComponent(st.parking):'');

  if(st.parking||hasC)t+='<b>Stationnement :</b> '+esc(st.parking||(st.parkLat+', '+st.parkLon))+(st.walkMin!=null?' · '+st.walkMin+' min à pied jusqu’au ravito':'')+'. ';
  else if(st.walkMin!=null)t+='<b>Marche jusqu’au ravito :</b> '+st.walkMin+' min. ';
  if(st.driveMin!=null)t+='<b>Trajet depuis '+(prev==='le départ'?'le départ':esc(prev))+' :</b> '+st.driveMin+' min en voiture.';
  t+='</p>';
  if(dest)t+='<div class="maplinks"><a class="btn quiet small" href="https://www.google.com/maps/dir/?api=1&destination='+dest+'&travelmode=driving" target="_blank" rel="noopener noreferrer">Aller au stationnement</a></div>';
  return t;
}

      +(x.margin!=null&&!passed?'<p class="'+mcls(x.margin)+'">Marge sur la barrière : '+mfmt(x.margin)+'</p>':'')

      +(sg?'<p>Jusqu’à <b>'+esc(sg.to)+'</b> ('+km1(sg.km)+' km, +'+sg.up+' m, −'+sg.down+' m, environ '+fmtDur(sg.dur)+')'+(sg.via.length?', en passant par '+sg.via.map(esc).join(' et ')+' (sans accès assistance)':'')+' : prévoir <b>'+needsText(sg.needs)+'</b>.</p>':'')
      +(gpsAvailable(r)?'<div class="maplinks">'+mapsLinks(r,m,x.km)+'</div>':'')
      +itemsBlock(r,x.st)+'</article>';
  }).join('');
  const startNote=(segs.length&&segs[0].fromId==='start')?'<section class="sec"><h2>Au départ</h2><p>Le coureur doit partir avec de quoi aller jusqu’à <b>'+esc(segs[0].to)+'</b> ('+km1(segs[0].km)+' km'+(segs[0].via.length?', en passant par '+segs[0].via.map(esc).join(' et ')+', sans accès assistance':'')+') : <b>'+needsText(segs[0].needs)+'</b>.</p></section>':'';
  const fin=rows[rows.length-1],finE=tlO.rows[rows.length-1].adjArr,finL=tlP.rows[rows.length-1].adjArr;
  return '<section class="empty"><h1>Équipe d’assistance</h1>'
  +'<p class="lead">Fenêtres de passage (course 8 % plus rapide ou 12 % plus lente que prévu), ce qu’il faut préparer et ce qu’il faut remplir à chaque ravito.</p></section>'
  +syncPanel(r)
  +trackPanel(r)
  +gpsPanel(r)
  +startNote
  +(cards||'<p class="note">Aucun ravito avec accès assistance. Coche « Accès pour l’assistance » dans l’onglet Plan.</p>')
  +(without.length?'<p class="note">Sans accès assistance : '+without.map(x=>esc(x.name)).join(', ')+'.</p>':'')
  +'<section class="sec"><h2>Pour les supporters à l’arrivée</h2><p>'+(fin.actual!=null?'Arrivée pointée à '+clk(fin.actual)+'.':'Arrivée estimée entre '+clk(finE)+' et '+clk(finL)+'.')+'</p></section>'
  +'<section class="sec"><h2>Sans connexion : partager le plan par code</h2>'
  +'<p class="note">Copie le code et envoie-le par message. Ton équipe le colle ici pour retrouver ton plan. Ce prototype ne synchronise pas les pointages en direct entre appareils.</p>'
  +'<div class="row"><button class="btn" data-act="copy-code">Copier le code du plan</button><button class="btn quiet" data-act="show-import">Coller un code reçu</button></div>'
  +(shareCode?'<textarea class="in code" readonly aria-label="Code du plan" id="codebox">'+esc(shareCode)+'</textarea>':'')
  +(importOpen?'<textarea class="in code" id="importbox" placeholder="Colle le code ici" aria-label="Code à importer"></textarea><div class="row"><button class="btn primary" data-act="do-import">Importer ce plan</button></div><p class="note">L’import remplace la course actuelle sur cet appareil.</p>':'')
  +'</section>';
}
function startCard(r,m){
  const owner=!isMember(r),planTime=fmtClock(m.startMin).s;
  if(r.startAt==null){
    return '<div class="card" style="margin-top:14px"><h2>Départ de la course</h2>'
      +'<p class="hint">Départ prévu à <b class="t">'+planTime+'</b>. Dès que le départ est donné, confirme-le : toutes les heures de passage partent de cette minute.</p>'
      +'<div class="row"><button class="btn primary" data-act="start-race" data-at="plan">Le départ est donné à '+planTime+'</button></div>'
      +'<p class="hint" style="margin:10px 0 4px">Le départ a eu lieu à une autre heure ?</p>'
      +'<div class="row" style="margin:0"><label class="fld" style="flex:1;min-width:130px"><span>Heure réelle du départ</span><input type="time" id="start-time" value="'+hhmmNow()+'"></label><button class="btn" data-act="start-race">Valider cette heure</button></div>'
      +(owner?'<details style="margin-top:10px"><summary>Le départ est repoussé ?</summary><p class="hint">Modifie l’heure de départ prévue : les heures estimées et les barrières calculées sont recalculées.</p>'
        +'<div class="row" style="margin:0"><label class="fld" style="flex:1;min-width:130px"><span>Nouvelle heure prévue</span><input type="time" id="plan-start" value="'+esc(r.start)+'"></label><button class="btn" data-act="set-plan-start">Modifier l’heure prévue</button></div></details>':'')
      +'</div>';
  }
  const d=Math.round(m.start0-m.startMin);
  return '<div class="card" style="margin-top:14px"><p style="margin:0">Départ donné à <b class="t">'+fmtClock(m.start0).s+'</b> (prévu à '+planTime+(d?', '+dsign(d):'')+').</p>'
    +'<div class="row" style="margin:10px 0 0"><label class="fld" style="flex:1;min-width:130px"><span>Modifier l’heure du départ</span><input type="time" id="start-time" value="'+fmtClock(m.start0).s+'"></label><button class="btn" data-act="start-race">Enregistrer</button></div>'
    +'<div class="row" style="margin:6px 0 0"><button class="btn quiet small" data-act="clear-start">Annuler le départ</button></div></div>';
}
function renderLive(){
  const r=state.race;if(!r)return needRace();
  const m=model(r),tl=timeline(r,m,{}),plan=timeline(r,m,{plan:true});
  const now=nowMin(r),rows=tl.rows;
  const fin=rows[rows.length-1],finPlan=plan.rows[rows.length-1];
  const delta=fin.adjArr-finPlan.adjArr;
  const nextIdx=rows.findIndex(x=>x.actual==null&&!x.passedEst);
  const finished=nextIdx===-1,started=(r.startAt!=null)?now>=m.start0:now>=m.startMin;
  let status;
  if(finished)status='Arrivée pointée.';
  else if(!started){const d=m.startMin-now;status='Départ dans '+(d>=1440?Math.floor(d/1440)+' j ':'')+fmtDur(d%1440)+'.';}
  else status='En course depuis '+fmtDur(now-m.start0)+(r.startAt!=null?' (départ donné).':'.');
  const kmNow=started?tl.kmAt(now):null;
  const svg=profileSVG(m,tl,{w:chartW(),kmNow:kmNow});
  const anyPoint=rows.some(x=>x.actual!=null)||!!r.fix;
  const list=rows.map((x,i)=>{
    const cls=(x.actual!=null||x.passedEst)?'done':(i===nextIdx?'next':'todo');
    let times;
    if(x.actual!=null)times='<span><small>Pointé</small>'+clk(x.actual)+'</span><span><small>Prévu</small>'+clk(x.plannedArr)+'</span><span class="'+(x.actual-x.plannedArr>5?'warn':'ok')+'">'+dsign(x.actual-x.plannedArr)+'</span>';
    else if(x.passedEst)times='<span><small>Déjà passé, estimé</small>'+clk(x.adjArr)+'</span><span><small>Prévu</small>'+clk(x.plannedArr)+'</span>';
    else times='<span><small>Prévu</small>'+clk(x.plannedArr)+'</span><span><small>Estimé</small>'+clk(x.adjArr)+'</span>'+(x.margin!=null?'<span class="'+mcls(x.margin)+'">Marge '+mfmt(x.margin)+'</span>':'');
    return '<li class="pt '+cls+'"><div class="pt-main">'+esc(x.name)+' <span class="km">km '+km1(x.km)+'</span></div><div class="pt-times">'+times+'</div></li>';
  }).join('');
  let next='';
  if(!finished){
    const x=rows[nextIdx];
    next='<section class="sec"><h2>Prochain point : '+esc(x.name)+'</h2><p class="hint">Pointer, c’est noter l’heure à laquelle le coureur arrive à ce ravito.</p><p>Estimé à '+clk(x.adjArr)+', au km '+km1(x.km)+'.</p>'
      +'<div class="row"><label class="fld" style="flex:1;min-width:140px"><span>Heure de passage</span><input type="time" id="pt-time" value="'+hhmmNow()+'"></label>'
      +'<button class="btn primary" data-act="point">Pointer le passage</button></div></section>';
  }
  return '<section class="empty"><div class="clock" id="clock">'+fmtClock(nowClock()).s+'</div><p class="status">'+status+'</p>'+(r.sync?'<p class="note" id="syncstat" style="margin-top:6px">'+esc(syncText(r))+'</p>':'')
  +(finished?'':startCard(r,m))
  +'<dl class="sum"><div><dt>Arrivée estimée</dt><dd>'+clk(fin.adjArr)+'</dd></div><div><dt>Prévue</dt><dd>'+clk(finPlan.adjArr)+'</dd></div>'
  +(anyPoint?'<div><dt>Écart</dt><dd class="'+(delta>5?'warn':'ok')+'">'+dsign(delta)+'</dd></div>':'')+'</dl>'
  +(anyPoint?'':'<p class="note" style="margin-top:10px">Aucun passage pointé : l’estimation suit le plan. Sans date de course, on suppose qu’elle a lieu aujourd’hui.</p>')
  +'<div class="chart" data-fixchart data-w="'+chartW()+'" data-l="46" data-r="10" data-tot="'+m.tot+'">'+svg+'</div>'
  +(kmNow!=null?'<div class="legend"><span style="color:var(--live)">Point rose : position estimée, km '+km1(kmNow)+'</span></div>':'')
  +'<div class="row" style="margin:8px 0 0"><button class="btn quiet small" data-act="land-open">Vue horizontale</button></div></section>'
  +next
  +fixPanel(r,m)
  +'<section class="sec"><h2>Passages</h2><ol class="pts">'+list+'</ol>'
  +'<div class="row">'
  +(anyPoint?'<button class="btn quiet" data-act="undo">Annuler le dernier pointage</button>'+((!r.sync||r.sync.role==='owner')?'<button class="btn quiet" data-act="clear-points">Effacer les pointages</button>':''):(r.sync?'':'<button class="btn quiet" data-act="simulate">Simuler un coureur 10 % plus lent</button>'))
  +'</div><p class="note">À chaque pointage, les heures suivantes sont recalculées : le retard ou l’avance pris jusque-là se répercute en partie sur la suite.</p></section>';
}
function renderDiary(){
  const r=state.race;if(!r)return needRace()+renderJournal();
  const m=model(r),tl=timeline(r,m,{}),plan=timeline(r,m,{plan:true});
  const done=tl.rows.filter(x=>x.actual!=null);
  const finRow=tl.rows[tl.rows.length-1];
  const d=r.diary||{rating:0,nutrition:'',learn:'',gear:''};
  const table=done.length?'<div class="tblwrap"><table><thead><tr><th>Point</th><th>Prévu</th><th>Réel</th><th>Écart</th></tr></thead><tbody>'
    +done.map(x=>'<tr><td>'+esc(x.name)+'<small>km '+km1(x.km)+'</small></td><td>'+clk(x.plannedArr)+'</td><td>'+clk(x.actual)+'</td><td class="'+(x.actual-x.plannedArr>5?'warn':'ok')+'">'+dsign(x.actual-x.plannedArr)+'</td></tr>').join('')
    +'</tbody></table></div>':'<p class="note">Les passages pointés dans « En course » apparaîtront ici, comparés au plan.</p>';
  const actualTotal=finRow.actual!=null?finRow.actual-m.startMin:null;
  const rate=['Dur','Moyen','Bien','Très bien','Top'].map((t,i)=>'<button data-act="rating" data-v="'+(i+1)+'" aria-pressed="'+(d.rating===i+1)+'" aria-label="'+(i+1)+' sur 5, '+t+'">'+(i+1)+'</button>').join('');
  return '<section class="empty"><h1>Carnet de course</h1><p class="lead">'+esc(r.name)+'</p>'
  +(actualTotal!=null?'<dl class="sum"><div><dt>Temps réel</dt><dd>'+fmtDur(actualTotal)+'</dd></div><div><dt>Objectif</dt><dd>'+fmtDur(m.target)+'</dd></div><div><dt>Écart</dt><dd class="'+(actualTotal-m.target>5?'warn':'ok')+'">'+dsign(actualTotal-m.target)+'</dd></div></dl>':'')
  +'</section>'
  +'<section class="sec"><h2>Prévu et réel</h2>'+table+'</section>'
  +'<section class="sec"><h2>Ton ressenti</h2><div class="rating" role="group" aria-label="Ressenti de 1 à 5">'+rate+'</div>'
  +'<label class="fld"><span>Ce que tu as vraiment mangé et bu</span><textarea class="in" data-diary="nutrition">'+esc(d.nutrition)+'</textarea></label>'
  +'<label class="fld" style="margin-top:12px"><span>Matériel utilisé</span><textarea class="in" data-diary="gear">'+esc(d.gear)+'</textarea></label>'
  +'<label class="fld" style="margin-top:12px"><span>Ce que tu referas ou changeras</span><textarea class="in" data-diary="learn">'+esc(d.learn)+'</textarea></label>'
  +'<div class="row"><button class="btn primary" data-act="archive">Archiver dans le carnet</button></div>'
  +'<p class="note">L’archivage garde un résumé de la course dans la liste ci-dessous et remet à zéro les pointages et le ressenti.</p></section>'
  +renderJournal();
}
function renderJournal(){
  const j=state.journal||[];if(!j.length)return '';
  return '<section class="sec"><h2>Courses archivées</h2><ul class="journal">'+j.map(e=>'<li><div><b>'+esc(e.name)+'</b><br><small>'+(e.date?esc(e.date)+', ':'')+km1(e.km)+' km, +'+nf(e.up)+' m'+(e.actual!=null?', réel '+fmtDur(e.actual)+' pour un objectif de '+fmtDur(e.planned):', objectif '+fmtDur(e.planned))+(e.rating?', ressenti '+e.rating+'/5':'')+'</small>'+(e.learn?'<br><small>'+esc(e.learn)+'</small>':'')+'</div><button class="icon" data-act="del-journal" data-id="'+e.id+'" aria-label="Supprimer '+esc(e.name)+' du carnet">×</button></li>').join('')+'</ul></section>';
}

// ---------- rendu ----------
function render(top){
  document.body.classList.toggle('welcome',tab==='welcome');
  document.querySelectorAll('.tabbtn').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const y=window.scrollY;
  let html='';
  try{
    updateChrome();
    html=tab==='welcome'?renderWelcome():tab==='plan'?renderPlan():tab==='assist'?renderAssist():tab==='live'?renderLive():tab==='login'?renderLogin():tab==='runner'?(isRunner()?renderRunner():renderLogin()):tab==='settings'?renderSettings():tab==='prefs'?renderPrefs():tab==='help'?renderHelp():renderDiary();
  }catch(err){html='<section class="empty"><h1>Oups</h1><p class="lead">Un calcul a échoué : '+esc(err.message)+'.</p><button class="btn" data-act="demo">Recharger la course démo</button></section>';}
  root.innerHTML=html;
  window.scrollTo(0,top?0:y);
  if(tab==='assist')checkPerms();
  if(tab==='settings'&&isRunner()&&provInfo===null&&!provLoading){provLoading=true;loadProviders();}
}
